[pytest]
# PivoxQuant — pytest configuration
# NASA mission-critical testing standard
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Verbose + short tracebacks
addopts =
    -v
    --tb=short
    --strict-markers
    -p no:cacheprovider

# Custom markers — declare to avoid PytestUnknownMarkWarning
markers =
    unit: Pure function / isolated logic tests
    integration: Flask app + DB tests
    security: CSRF, rate limit, auth bypass tests
    slow: Tests that take >1 second
    external: Tests that hit real external APIs (normally skipped)
    live_api: Require live backend + network; skipped by default (run with: pytest -m live_api)
    smoke: Fast end-to-end deploy-sanity checks (health/auth/portfolio, <60s); pre-push gate

# Filter noisy deprecation warnings from third-party libs
filterwarnings =
    ignore::DeprecationWarning:flask_sqlalchemy.*
    ignore::DeprecationWarning:werkzeug.*
    ignore::DeprecationWarning:dateutil.*
    ignore::PendingDeprecationWarning

# Coverage (opt-in via CLI: pytest --cov=routes --cov=services)
# pytest-cov, if installed, will pick up these defaults.
# Run:
#   pytest tests/ --cov=routes --cov=services --cov-report=term-missing
