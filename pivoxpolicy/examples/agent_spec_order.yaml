# 에이전트 명세 예시 — 가상 증권사의 주문 · 정산 보조 에이전트 (실제 회사 아님)
# 도구 정의는 회사 코드에 이미 있는 것을 그대로 붙여 넣는다. 형식을 섞어도 된다(Anthropic · OpenAI · MCP).
# 콘솔 '명세서로 등록' 에 붙여 넣거나:  python3 -m pivoxpolicy.cli diagnose examples/agent_spec_order.yaml --out out/diagnosis
pivoxpolicy_agent_spec: 1
agent:
  name: 주문·정산 보조 에이전트
  owner: 디지털영업본부
  purpose: 고객 주문 접수와 거래처 정산을 돕는다
  model: {name: claude, deployment: foreign_api}      # onprem | domestic_cloud | foreign_api
  serves_retail: true                                  # 일반투자자를 상대한다
  automated_decision: false
  system_prompt: |
    너는 가상 증권사 B의 주문·정산 보조 에이전트다. 고객이 요청한 주문을 접수하고, 거래처 정산을 처리한다.
    시장 뉴스를 참고할 수 있다. 도구 호출은 회사의 통제 서버가 실행 전에 검사한다.

# 지금 통제 수준(자가 진단) — 0 없음 · 1 사람·계정까지 · 2 AI 에이전트까지
controls: {inventory: 1, vendors: 1, unique_id: 1, least_privilege: 1, human_approval: 2, audit_trail: 1, kill_switch: 1}
limits: {max_amount: 5000000, max_high_risk_per_min: 5}

components:
  - {tool: place_order, name: broker-gw, version: 4.2.0, sha256: 1111111111111111111111111111111111111111111111111111111111111111}
  - {tool: transfer_funds, name: pay-gateway-mcp, version: 1.4.2}

tools:
  # Anthropic
  - name: get_quote
    description: 종목의 현재가를 조회한다
    input_schema: {type: object, properties: {symbol: {type: string}}, required: [symbol]}
  - name: place_order
    description: 고객 계좌로 매수·매도 주문을 낸다
    input_schema:
      type: object
      properties:
        customer_id: {type: string}
        symbol: {type: string}
        side: {type: string, enum: [buy, sell]}
        quantity: {type: integer}
        notional_krw: {type: integer, description: 주문 금액(원)}
      required: [customer_id, symbol, side, quantity, notional_krw]
  # OpenAI
  - type: function
    function:
      name: transfer_funds
      description: 회사 정산 계좌에서 거래처 계좌로 송금한다
      parameters:
        type: object
        properties:
          to_account: {type: string}
          amount: {type: integer}
          memo: {type: string}
        required: [to_account, amount]
  # MCP
  - name: fetch_news
    description: 주제에 맞는 오늘자 시장 뉴스 본문을 가져온다
    inputSchema: {type: object, properties: {topic: {type: string}}, required: [topic]}
    annotations: {readOnlyHint: true, openWorldHint: true}
  - name: lookup_account
    description: 고객의 잔고와 보유 종목을 조회한다
    inputSchema: {type: object, properties: {customer_id: {type: string}}, required: [customer_id]}
    annotations: {readOnlyHint: true}
  - name: send_email
    description: 고객에게 안내 메일을 보낸다
    inputSchema: {type: object, properties: {to: {type: string}, subject: {type: string}, body: {type: string}}, required: [to, body]}
