[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pivoxpolicy"
version = "0.1.0"
description = "AI 에이전트 관련 금융 보안 규제·가이드라인을 수집·코딩·비교하는 연구 도구"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]
agent = ["anthropic>=2.8"]   # examples/llm_agent.py 만 쓴다 — 본체 · 런타임 서버는 표준 라이브러리

[project.scripts]
pivoxpolicy = "pivoxpolicy.cli:main"

[tool.setuptools.packages.find]
include = ["pivoxpolicy*"]

[tool.setuptools.package-data]
pivoxpolicy = ["templates/*.css", "templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
