scoring_rules:
  - "단일 등급으로 합산하지 않는다. 출력은 차원별 레벨 0~3 프로필(그룹별 묶음)이다."
  - "그룹 요약은 평균이 아니라 분포(레벨별 개수)와 '검증(3) 차원 수 / 증거없음(0) 차원 수' 로 보여 준다."
  - "unknown(레벨 미기입, null)은 0 과 구분한다 — '코딩 필요' 로 집계하고 분모에서 뺀다."
  - "사건 데이터가 증거가 되는 차원을 명시한다: 탐지시간→detection_time, 침입 경로→test_scope, 제재 공개안의 통제 실패→해당 agent_control·connection 차원(롯데카드 escalation=경영진 조치 없음)."
  - "평가자 2명이 같은 기관을 평가하면 차원 레벨 수열로 Cohen's κ(선형가중) 를 낸다."
  - "evidence_level(primary/press/vendor) 을 레벨과 함께 기록한다. press 만으로 레벨 3 을 주지 않는다."

pitfalls:
  - "특정 회사 평가를 공개할 때 명예훼손·공정성 위험 — 레벨은 '증거 수준' 이지 '이 회사가 못한다' 가 아님을 명시."
  - "공시 유무 ≠ 실행 유무. 미국 10-K 와 한국 사업보고서의 공시 의무가 달라 국가 간 레벨을 직접 비교하면 안 됨."
  - "evidence_level 혼동 — 보도(press)를 1차(primary)처럼 쓰면 레벨 인플레."
  - "사건이 없는 회사는 response 차원을 평가할 수 없음(증거 부재 ≠ 대응 부실). 분모에서 제외."
