# 내부통제 평가 루브릭 — 금융회사가 AI 에이전트를 "직원처럼" 통제하는지를
# 외부 연구자가 공개 자료로 평가하기 위한 도구.
#
# 어떻게 레벨을 매기나 (제대로):
#   평가자는 레벨(0~3)을 직접 고르지 않는다. 각 차원의 **신호(signals)** 를 공개 자료에서 확인해
#   observed: true/false/null 과 증거 수준만 적고, 레벨은 도출된다 (pivoxpolicy/rubric.py::derive_level).
#     - 신호 발화 = observed:true 이고 증거 수준이 그 신호의 min_evidence 이상
#     - 차원 레벨 = 발화한 신호 중 최고 level · 하나도 발화 안 했는데 하나라도 false 면 0 · 전부 null 이면 미평가
#     - L3 신호는 min_evidence=primary → 보도(press)만으로는 레벨 3 에 도달 못 한다(구조적 강제)
#   코드북 전문: `pivoxpolicy rubric --codebook`
#
# 레벨 척도 (levels 는 사람이 읽는 앵커, signals 는 기계 규칙):
#   0 공개 증거 없음(통제 부재가 아님) · 1 언급 · 2 구체(대상·주기·책임) · 3 검증(제3자·수치·감독기관)
#
# provisional: 신호 정의는 덱 슬라이드 14·15 와 pivoxmap 평가체계 노트에서 옮긴 것이다.
# 리서치 워크플로가 FSB(최종)·NIST NCCoE·OWASP ASI·금보원 17항목 원문으로 basis·신호를 채우면 교체한다.
provisional: true
source_note: 덱 슬라이드 2·14·15 + pivoxmap/docs/research/fin-breach_assessment-frameworks_2026-10-31.md (2026-11-11)

dimensions:
  # ── agent_control: 7개 통제 (레지스트리 controls.yaml 과 id 일치) ──
  - id: inventory
    num: 1
    group: agent_control
    name_ko: 에이전트 인벤토리
    name_en: Agent inventory
    question: 회사가 운영 중인 AI 에이전트·그 접근권한·책임자를 등록·관리하는 증거가 있는가
    levels:
      - {level: 0, label_ko: 증거 없음, criterion: AI 에이전트 목록·거버넌스에 대한 공개 언급 없음}
      - {level: 1, label_ko: 언급, criterion: AI 활용·거버넌스를 원칙 수준으로 언급}
      - {level: 2, label_ko: 구체, criterion: AI 사용 사례·책임 부서를 구체적으로 공개}
      - {level: 3, label_ko: 검증, criterion: 제3자 점검·감독기관 보고로 인벤토리 존재가 확인}
    signals:
      - {id: mentions_ai_governance, level: 1, min_evidence: press, question: "AI 활용·거버넌스를 공개 자료에서 언급하는가"}
      - {id: discloses_ai_usecases, level: 2, min_evidence: primary, question: "AI 사용 사례·책임 부서를 구체적으로 공개하는가(예: 10-K Item 1C)"}
      - {id: verified_inventory, level: 3, min_evidence: primary, question: "제3자 점검·감독기관 보고로 에이전트 인벤토리 존재가 확인되는가"}
    public_evidence_sources: [10-K Item 1C, 사업보고서 정보보호 현황, KISA 정보보호 공시, AI 거버넌스 보도자료]
    basis: [FSB SP(최종), Treasury FS AI RMF 인벤토리, NYDFS 500.13]

  - id: vendors
    num: 2
    group: agent_control
    name_ko: 공급자·제3자 AI
    name_en: Vendor / third-party AI
    question: 외부 AI·에이전트 공급자에 대한 취약점 통지·로그·계약 통제 증거가 있는가
    levels:
      - {level: 0, label_ko: 증거 없음, criterion: 제3자 AI 위탁 통제에 대한 공개 근거 없음}
      - {level: 1, label_ko: 언급, criterion: 외주·제3자 리스크 관리를 일반 원칙으로 언급}
      - {level: 2, label_ko: 구체, criterion: AI 공급자 계약·점검 항목을 구체화}
      - {level: 3, label_ko: 검증, criterion: 위탁 점검 결과·감독기관 확인이 공개}
    signals:
      - {id: mentions_third_party_risk, level: 1, min_evidence: press, question: "외주·제3자 리스크 관리를 언급하는가"}
      - {id: specifies_ai_vendor_controls, level: 2, min_evidence: primary, question: "AI 공급자 계약·점검 항목(취약점 통지·로그 제공 등)을 구체화하는가"}
      - {id: verified_vendor_review, level: 3, min_evidence: primary, question: "위탁 점검 결과·감독기관 확인이 공개되는가"}
    public_evidence_sources: [IT 위탁 공시, 제재 공개안의 위탁 관련 지적, 10-K 제3자 리스크]
    basis: [FSB SP, Treasury FS AI RMF 제3자, NYDFS 500.11]

  - id: unique_id
    num: 3
    group: agent_control
    name_ko: 고유 식별자
    name_en: Unique agent ID
    question: 에이전트마다 별도 계정·식별자를 두고 사람 신원에 연결하는 증거가 있는가
    levels:
      - {level: 0, label_ko: 증거 없음, criterion: 에이전트 식별·계정 분리에 대한 공개 근거 없음}
      - {level: 1, label_ko: 언급, criterion: 계정·접근통제 원칙을 일반적으로 언급}
      - {level: 2, label_ko: 구체, criterion: 에이전트·서비스 계정을 사람 계정과 구분해 관리한다고 구체화}
      - {level: 3, label_ko: 검증, criterion: 로그·점검에서 에이전트 계정이 사람과 식별됨이 확인}
    signals:
      - {id: mentions_access_control, level: 1, min_evidence: press, question: "계정·접근통제 원칙을 언급하는가"}
      - {id: separates_agent_accounts, level: 2, min_evidence: primary, question: "에이전트·서비스 계정을 사람 계정과 구분해 관리한다고 구체화하는가"}
      - {id: verified_agent_identity, level: 3, min_evidence: primary, question: "로그·점검에서 에이전트 계정이 사람과 식별됨이 확인되는가"}
    public_evidence_sources: [정보보호 공시 접근통제 항목, 제재 공개안 로그 지적]
    basis: [NIST NCCoE 에이전트 신원, FSB SP, EFSR 제13조(사람 기준)]

  - id: least_privilege
    num: 4
    group: agent_control
    name_ko: 최소 권한
    name_en: Least privilege
    question: 신뢰할 수 없는 입력이 섞일 때 에이전트의 외부 전송·실행을 막는 증거가 있는가
    levels:
      - {level: 0, label_ko: 증거 없음, criterion: 에이전트 권한 제한에 대한 공개 근거 없음}
      - {level: 1, label_ko: 언급, criterion: 최소권한 원칙을 일반적으로 언급}
      - {level: 2, label_ko: 구체, criterion: 출처 기반 행위 차단·도구 권한 제한을 구체화}
      - {level: 3, label_ko: 검증, criterion: 레드팀·점검에서 권한 격리가 검증}
    signals:
      - {id: mentions_least_privilege, level: 1, min_evidence: press, question: "최소권한 원칙을 언급하는가"}
      - {id: specifies_source_based_limits, level: 2, min_evidence: primary, question: "출처 기반 행위 차단·도구 권한 제한(샌드박스 등)을 구체화하는가"}
      - {id: redteam_verified_isolation, level: 3, min_evidence: primary, question: "레드팀·점검에서 권한 격리가 검증되는가"}
    public_evidence_sources: [정보보호 공시, 레드팀 결과 공개, 제재 공개안]
    basis: [EchoLeak·FIDES(출처 기반 차단), FSB SP, FINRA 2026, OWASP ASI]

  - id: human_approval
    num: 5
    group: agent_control
    name_ko: 사람 승인
    name_en: Human approval
    question: 고위험 행위에 사람 승인 게이트를 두는 증거가 있는가(모든 행위 승인은 피로를 부름)
    levels:
      - {level: 0, label_ko: 증거 없음, criterion: 사람 개입·승인 절차에 대한 공개 근거 없음}
      - {level: 1, label_ko: 언급, criterion: 사람 개입·보조적 역할 원칙을 언급}
      - {level: 2, label_ko: 구체, criterion: 어떤 행위에 승인이 필요한지(위험 기반 트리거)를 구체화}
      - {level: 3, label_ko: 검증, criterion: 승인 로그·점검으로 게이트 작동이 확인}
    signals:
      - {id: mentions_human_in_loop, level: 1, min_evidence: press, question: "사람 개입·보조적 역할 원칙을 언급하는가"}
      - {id: specifies_risk_based_approval, level: 2, min_evidence: primary, question: "고위험 행위에 승인이 필요하다는 위험 기반 트리거를 구체화하는가"}
      - {id: verified_approval_gate, level: 3, min_evidence: primary, question: "승인 로그·점검으로 게이트 작동이 확인되는가"}
    public_evidence_sources: [AI 가이드라인 수용 공시, 내부통제 보고]
    basis: [FSC AI 가이드라인(보조적 역할), FSB SP(위험기반 트리거), EU AI Act 14(4)(d)]

  - id: audit_trail
    num: 6
    group: agent_control
    name_ko: 감사 기록
    name_en: Audit trail
    question: 에이전트의 입력·출처·도구 호출을 기록하는 증거가 있는가
    levels:
      - {level: 0, label_ko: 증거 없음, criterion: 에이전트 활동 로깅에 대한 공개 근거 없음}
      - {level: 1, label_ko: 언급, criterion: 로그 보존 원칙을 일반적으로 언급}
      - {level: 2, label_ko: 구체, criterion: 입력·출처·도구 호출 등 에이전트별 로그 항목을 구체화}
      - {level: 3, label_ko: 검증, criterion: 로그 보존·분석이 점검·제재문에서 확인}
    signals:
      - {id: mentions_logging, level: 1, min_evidence: press, question: "로그 보존 원칙을 언급하는가"}
      - {id: specifies_agent_log_items, level: 2, min_evidence: primary, question: "입력·출처·도구 호출 등 에이전트별 로그 항목을 구체화하는가"}
      - {id: verified_log_retention, level: 3, min_evidence: primary, question: "로그 보존·분석이 점검·제재문에서 확인되는가"}
    public_evidence_sources: [정보보호 공시 로그 항목, 제재 공개안(로그 평문·미보존 지적)]
    basis: [NIST NCCoE(데이터 흐름 추적), FSB SP, EFSR 제13조①9, NYDFS 500.6]

  - id: kill_switch
    num: 7
    group: agent_control
    name_ko: 즉시 중단
    name_en: Kill switch
    question: 에이전트를 즉시 멈추고 권한을 회수하는 수단과 그 정기 테스트 증거가 있는가
    levels:
      - {level: 0, label_ko: 증거 없음, criterion: 중단·권한회수 수단에 대한 공개 근거 없음}
      - {level: 1, label_ko: 언급, criterion: 비상 중단·대응 체계를 일반적으로 언급}
      - {level: 2, label_ko: 구체, criterion: 즉시 중단·권한 회수 수단과 책임을 구체화}
      - {level: 3, label_ko: 검증, criterion: 중단 메커니즘 테스트 결과가 확인}
    signals:
      - {id: mentions_emergency_stop, level: 1, min_evidence: press, question: "비상 중단·대응 체계를 언급하는가"}
      - {id: specifies_kill_switch, level: 2, min_evidence: primary, question: "즉시 중단·권한 회수 수단과 책임을 구체화하는가"}
      - {id: tested_kill_switch, level: 3, min_evidence: primary, question: "중단 메커니즘 테스트 결과가 확인되는가(FSI 레드팀 등)"}
    public_evidence_sources: [레드팀 결과, 비상대응 훈련 공개]
    basis: [FSB SP(안전 중단 테스트), FSI 기준 ⑯, EU AI Act 14(4)(e)]

  # ── connection: 덱의 핵심 논지 — 경고·보고가 조치로 "이어졌는가" (슬라이드 2·5) ──
  - id: warning_receipt
    num: 8
    group: connection
    name_ko: 경고 수신·전달
    name_en: Warning receipt & relay
    question: 감독기관·AI회사의 경고가 내부로 전달되고 조치로 이어진 기록이 있는가
    levels:
      - {level: 0, label_ko: 증거 없음, criterion: 경고 수신 후 내부 대응에 대한 공개 기록 없음}
      - {level: 1, label_ko: 언급, criterion: 경고를 인지·공유했다고 언급}
      - {level: 2, label_ko: 구체, criterion: 경고→부서 전달→조치 결정의 경로가 구체적으로 확인}
      - {level: 3, label_ko: 검증, criterion: 조치 이행이 제3자·감독기관 자료로 확인}
    signals:
      - {id: acknowledged_warning, level: 1, min_evidence: press, question: "감독기관·AI회사 경고를 인지·공유했다고 언급하는가"}
      - {id: relayed_to_action, level: 2, min_evidence: primary, question: "경고→부서 전달→조치 결정 경로가 구체적으로 확인되는가"}
      - {id: verified_action_taken, level: 3, min_evidence: primary, question: "조치 이행이 제3자·감독기관 자료로 확인되는가"}
    public_evidence_sources: [보도자료, 국회 제출자료, 제재 공개안, 사고 경위 발표]
    basis: [덱 슬라이드 2·5(미국=AI회사 탐지·통지, 한국=조치 공개기록 없음), COSO 정보·소통]

  - id: escalation
    num: 9
    group: connection
    name_ko: 보고·에스컬레이션
    name_en: CISO-to-management escalation
    question: 보안 책임자(CISO)의 보고가 경영진 결정·조치로 이어진 기록이 있는가
    levels:
      - {level: 0, label_ko: 증거 없음, criterion: 보고→경영진 조치 연결에 대한 공개 근거 없음}
      - {level: 1, label_ko: 언급, criterion: 보고 체계가 있다고 언급}
      - {level: 2, label_ko: 구체, criterion: 보고 후 경영진 조치가 구체적으로 확인}
      - {level: 3, label_ko: 검증, criterion: 보고·조치 기록이 제재문·감사에서 확인}
    signals:
      - {id: mentions_reporting_line, level: 1, min_evidence: press, question: "CISO 보고 체계가 있다고 언급하는가"}
      - {id: management_acted_on_report, level: 2, min_evidence: primary, question: "보고 후 경영진 조치가 구체적으로 확인되는가"}
      - {id: verified_report_action_record, level: 3, min_evidence: primary, question: "보고·조치 기록이 제재문·감사에서 확인되는가"}
    public_evidence_sources: ["제재 공개안(롯데카드: CISO 보고 뒤 경영진 조치 없음)", 내부통제 보고]
    basis: [덱(연결 실패), 롯데카드 금감원 공개안, COSO 통제환경, Basel 운영리스크]

  # ── testing: 모의해킹 제도화 4요소 (슬라이드 15) ──
  - id: test_frequency
    num: 10
    group: testing
    name_ko: 테스트 빈도
    name_en: Test frequency
    question: 침투·모의 테스트를 얼마나 자주 하는가(상시 AI 테스트에 가까운가)
    levels:
      - {level: 0, label_ko: 증거 없음, criterion: 침투·모의 테스트 수행에 대한 공개 근거 없음}
      - {level: 1, label_ko: 언급, criterion: 정기 점검을 한다고 언급}
      - {level: 2, label_ko: 구체, criterion: "연 N회 등 주기가 공개됨(예: 블라인드 연 2회)"}
      - {level: 3, label_ko: 검증, criterion: 상시·AI 기반 테스트 수행이 수치·감독기관 자료로 확인}
    signals:
      - {id: mentions_periodic_test, level: 1, min_evidence: press, question: "정기 점검·침투테스트를 한다고 언급하는가"}
      - {id: discloses_cadence, level: 2, min_evidence: primary, question: "연 N회 등 테스트 주기가 공개되는가"}
      - {id: verified_continuous_testing, level: 3, min_evidence: primary, question: "상시·AI 기반 테스트 수행이 수치·감독기관 자료로 확인되는가"}
