scoring_rules:
  - "레벨은 평가자가 직접 고르지 않는다 — 각 차원의 신호(observed:true/false/null + 증거수준)에서 도출한다(rubric.py::derive_level)."
  - "차원 레벨 = 발화한 신호 중 최고 level. 하나도 발화 안 했는데 하나라도 false 로 확인했으면 0. 전부 null 이면 미평가(분모 제외)."
  - "L3 신호는 min_evidence=primary — 보도(press)만으로 레벨 3 에 도달 못 한다. 구조적으로 강제됨."
  - "단일 등급으로 합산하지 않는다. 출력은 차원별 레벨 프로필 + 그룹별 분포뿐이다."
  - "사건 데이터가 신호의 증거가 되는 차원을 명시한다: 탐지시간→detection_time, 침입 경로→test_scope, 제재 공개안의 통제 실패→해당 agent_control·connection 신호(롯데카드 escalation=경영진 조치 없음)."
  - "평가자 2명이 같은 기관을 평가하면 (a) 신호 단위 κ(관찰 일치)와 (b) 도출 레벨 κ(선형가중)를 함께 낸다. 신호 κ 가 더 엄격한 재현성 지표다."

pitfalls:
  - "특정 회사 평가를 공개할 때 명예훼손·공정성 위험 — 레벨은 '증거 수준' 이지 '이 회사가 못한다' 가 아님을 명시."
  - "공시 유무 ≠ 실행 유무. 미국 10-K 와 한국 사업보고서의 공시 의무가 달라 국가 간 레벨을 직접 비교하면 안 됨."
  - "증거 수준 혼동 — 보도(press)를 primary 처럼 적으면 L2 신호가 잘못 발화해 레벨 인플레."
  - "사건이 없는 회사는 response 차원 신호를 확인할 수 없음(전부 null → 미평가). 증거 부재 ≠ 대응 부실."
