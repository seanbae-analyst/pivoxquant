# 내부통제 평가 루브릭 — 금융회사가 AI 에이전트를 "직원처럼" 통제하는지를
# 외부 연구자가 공개 자료로 평가하기 위한 도구.
#
# 설계 원칙 (발표 덱 2026-11-01 슬라이드 9·10 의 논지에서 나옴):
#   - 등급·점수 한 개로 뭉치지 않는다. 인증·등급(ISMS-P·S등급)이 실제 방어를 보장하지 않았다
#     (신한 S등급 보유 중 침해). 그래서 차원별 '증거 수준' 프로필만 만든다.
#   - 레벨은 "통제가 있다/없다" 가 아니라 "공개 증거가 어디까지 있나" 를 잰다.
#     **증거 없음(0) ≠ 통제 없음.** 회사가 비공개로 할 수도 있다(실무자 피드백 2026-11).
#     그래서 결과는 "그 회사가 못한다" 가 아니라 "외부에서 검증할 수 있는 수준" 이다.
#
# 레벨 척도 (모든 차원 공통):
#   0  공개 증거 없음        — 공시·보도·제재문 어디에도 근거가 없음 (통제 부재가 아님)
#   1  언급만                — 원칙·계획·방침을 말했으나 대상·주기·책임이 없음
#   2  구체 기술             — 대상·주기·책임자·방법이 공개 자료에 적혀 있음
#   3  검증 가능             — 제3자 점검·수치·감독기관 확인 등 외부가 대조할 수 있는 증거
#
# provisional: 이 시드는 덱 슬라이드 14·15 와 pivoxmap 평가체계 노트에서 옮긴 것이다.
# 리서치 워크플로가 FSB(최종본)·NIST NCCoE·OWASP ASI·금보원 17항목 원문으로 basis 를 채우면 교체한다.
provisional: true
source_note: 덱 슬라이드 2·14·15 + pivoxmap/docs/research/fin-breach_assessment-frameworks_2026-10-31.md (2026-11-11)

dimensions:
  # ── agent_control: 7개 통제 (레지스트리 controls.yaml 과 id 일치) ──
  - id: inventory
    num: 1
    group: agent_control
    name_ko: 에이전트 인벤토리
    name_en: Agent inventory
    question: 회사가 운영 중인 AI 에이전트·그 접근권한·책임자를 등록·관리하는 증거가 있는가
    levels:
      - {level: 0, label_ko: 증거 없음, criterion: AI 에이전트 목록·거버넌스에 대한 공개 언급 없음}
      - {level: 1, label_ko: 언급, criterion: "AI 활용·거버넌스를 원칙 수준으로 언급(사업보고서·보도자료)"}
      - {level: 2, label_ko: 구체, criterion: "AI 사용 사례·책임 부서를 구체적으로 공개(예: 10-K Item 1C, AI 거버넌스 체계도)"}
      - {level: 3, label_ko: 검증, criterion: 제3자 점검·감독기관 보고로 인벤토리 존재가 확인됨}
    public_evidence_sources: [10-K Item 1C, 사업보고서 정보보호 현황, KISA 정보보호 공시, AI 거버넌스 보도자료]
    basis: [FSB SP(최종), Treasury FS AI RMF 인벤토리, NYDFS 500.13]

  - id: vendors
    num: 2
    group: agent_control
    name_ko: 공급자·제3자 AI
    name_en: Vendor / third-party AI
    question: 외부 AI·에이전트 공급자에 대한 취약점 통지·로그·계약 통제 증거가 있는가
    levels:
      - {level: 0, label_ko: 증거 없음, criterion: 제3자 AI 위탁 통제에 대한 공개 근거 없음}
      - {level: 1, label_ko: 언급, criterion: 외주·제3자 리스크 관리를 일반 원칙으로 언급}
      - {level: 2, label_ko: 구체, criterion: AI 공급자 계약·점검 항목(취약점 통지·로그 제공 등)을 구체화}
      - {level: 3, label_ko: 검증, criterion: 위탁 점검 결과·감독기관 확인이 공개됨}
    public_evidence_sources: [IT 위탁 공시, 제재 공개안의 위탁 관련 지적, 10-K 제3자 리스크]
    basis: [FSB SP, Treasury FS AI RMF 제3자, NYDFS 500.11]

  - id: unique_id
    num: 3
    group: agent_control
    name_ko: 고유 식별자
    name_en: Unique agent ID
    question: 에이전트마다 별도 계정·식별자를 두고 사람 신원에 연결하는 증거가 있는가
    levels:
      - {level: 0, label_ko: 증거 없음, criterion: 에이전트 식별·계정 분리에 대한 공개 근거 없음}
      - {level: 1, label_ko: 언급, criterion: 계정·접근통제 원칙을 일반적으로 언급}
      - {level: 2, label_ko: 구체, criterion: 에이전트·서비스 계정을 사람 계정과 구분해 관리한다고 구체화}
      - {level: 3, label_ko: 검증, criterion: 로그·점검에서 에이전트 계정이 사람과 식별됨이 확인}
    public_evidence_sources: [정보보호 공시 접근통제 항목, 제재 공개안 로그 지적]
    basis: [NIST NCCoE 에이전트 신원, FSB SP, EFSR 제13조(사람 기준)]

  - id: least_privilege
    num: 4
    group: agent_control
    name_ko: 최소 권한
    name_en: Least privilege
    question: 신뢰할 수 없는 입력이 섞일 때 에이전트의 외부 전송·실행을 막는 증거가 있는가
    levels:
      - {level: 0, label_ko: 증거 없음, criterion: 에이전트 권한 제한에 대한 공개 근거 없음}
      - {level: 1, label_ko: 언급, criterion: 최소권한 원칙을 일반적으로 언급}
      - {level: 2, label_ko: 구체, criterion: 출처 기반 행위 차단·도구 권한 제한을 구체화(샌드박스 등)}
      - {level: 3, label_ko: 검증, criterion: 레드팀·점검에서 권한 격리가 검증됨}
    public_evidence_sources: [정보보호 공시, 레드팀 결과 공개, 제재 공개안]
    basis: [EchoLeak·FIDES(출처 기반 차단), FSB SP, FINRA 2026, OWASP ASI]

  - id: human_approval
    num: 5
    group: agent_control
    name_ko: 사람 승인
    name_en: Human approval
    question: 고위험 행위에 사람 승인 게이트를 두는 증거가 있는가(모든 행위 승인은 피로를 부름)
    levels:
      - {level: 0, label_ko: 증거 없음, criterion: 사람 개입·승인 절차에 대한 공개 근거 없음}
      - {level: 1, label_ko: 언급, criterion: 사람 개입·보조적 역할 원칙을 언급(가이드라인 수용 등)}
      - {level: 2, label_ko: 구체, criterion: 어떤 행위에 승인이 필요한지(위험 기반 트리거)를 구체화}
      - {level: 3, label_ko: 검증, criterion: 승인 로그·점검으로 게이트 작동이 확인됨}
    public_evidence_sources: [AI 가이드라인 수용 공시, 내부통제 보고]
    basis: [FSC AI 가이드라인(보조적 역할), FSB SP(위험기반 트리거), EU AI Act 14(4)(d)]

  - id: audit_trail
    num: 6
    group: agent_control
    name_ko: 감사 기록
    name_en: Audit trail
    question: 에이전트의 입력·출처·도구 호출을 기록하는 증거가 있는가
    levels:
      - {level: 0, label_ko: 증거 없음, criterion: 에이전트 활동 로깅에 대한 공개 근거 없음}
      - {level: 1, label_ko: 언급, criterion: 로그 보존 원칙을 일반적으로 언급}
      - {level: 2, label_ko: 구체, criterion: 입력·출처·도구 호출 등 에이전트별 로그 항목을 구체화}
      - {level: 3, label_ko: 검증, criterion: 로그 보존·분석이 점검·제재문에서 확인됨}
    public_evidence_sources: [정보보호 공시 로그 항목, 제재 공개안(로그 평문·미보존 지적)]
    basis: [NIST NCCoE(데이터 흐름 추적), FSB SP, EFSR 제13조①9, NYDFS 500.6]

  - id: kill_switch
    num: 7
    group: agent_control
    name_ko: 즉시 중단
    name_en: Kill switch
    question: 에이전트를 즉시 멈추고 권한을 회수하는 수단과 그 정기 테스트 증거가 있는가
    levels:
      - {level: 0, label_ko: 증거 없음, criterion: 중단·권한회수 수단에 대한 공개 근거 없음}
      - {level: 1, label_ko: 언급, criterion: 비상 중단·대응 체계를 일반적으로 언급}
      - {level: 2, label_ko: 구체, criterion: 즉시 중단·권한 회수 수단과 책임을 구체화}
      - {level: 3, label_ko: 검증, criterion: 중단 메커니즘 테스트 결과가 확인됨(FSI 레드팀 등)}
    public_evidence_sources: [레드팀 결과, 비상대응 훈련 공개]
    basis: [FSB SP(안전 중단 테스트), FSI 기준 ⑯, EU AI Act 14(4)(e)]

  # ── connection: 덱의 핵심 논지 — 경고·보고가 조치로 "이어졌는가" (슬라이드 2·5) ──
  - id: warning_receipt
    num: 8
    group: connection
    name_ko: 경고 수신·전달
    name_en: Warning receipt & relay
    question: 감독기관·AI회사의 경고가 내부로 전달되고 조치로 이어진 기록이 있는가
    levels:
      - {level: 0, label_ko: 증거 없음, criterion: 경고 수신 후 내부 대응에 대한 공개 기록 없음}
      - {level: 1, label_ko: 언급, criterion: 경고를 인지·공유했다고 언급}
      - {level: 2, label_ko: 구체, criterion: 경고→부서 전달→조치 결정의 경로가 구체적으로 확인}
      - {level: 3, label_ko: 검증, criterion: 조치 이행이 제3자·감독기관 자료로 확인}
    public_evidence_sources: [보도자료, 국회 제출자료, 제재 공개안, 사고 경위 발표]
    basis: [덱 슬라이드 2·5(미국=AI회사 탐지·통지, 한국=조치 공개기록 없음), COSO 정보·소통]

  - id: escalation
    num: 9
    group: connection
    name_ko: 보고·에스컬레이션
    name_en: CISO→management escalation
    question: 보안 책임자(CISO)의 보고가 경영진 결정·조치로 이어진 기록이 있는가
    levels:
      - {level: 0, label_ko: 증거 없음, criterion: 보고→경영진 조치 연결에 대한 공개 근거 없음}
      - {level: 1, label_ko: 언급, criterion: 보고 체계가 있다고 언급}
      - {level: 2, label_ko: 구체, criterion: 보고 후 경영진 조치가 구체적으로 확인}
      - {level: 3, label_ko: 검증, criterion: 보고·조치 기록이 제재문·감사에서 확인}
    public_evidence_sources: [제재 공개안(롯데카드: CISO 보고 뒤 경영진 조치 없음), 내부통제 보고]
    basis: [덱(연결 실패), 롯데카드 금감원 공개안, COSO 통제환경, Basel 운영리스크]

  # ── testing: 모의해킹 제도화 4요소 (슬라이드 15) ──
  - id: test_frequency
    num: 10
    group: testing
    name_ko: 테스트 빈도
    name_en: Test frequency
    question: 침투·모의 테스트를 얼마나 자주 하는가(상시 AI 테스트에 가까운가)
    levels:
      - {level: 0, label_ko: 증거 없음, criterion: 침투·모의 테스트 수행에 대한 공개 근거 없음}
      - {level: 1, label_ko: 언급, criterion: 정기 점검을 한다고 언급}
      - {level: 2, label_ko: 구체, criterion: "연 N회 등 주기가 공개됨(예: 블라인드 연 2회)"}
      - {level: 3, label_ko: 검증, criterion: 상시·AI 기반 테스트 수행이 수치·감독기관 자료로 확인}
    public_evidence_sources: [FSS·FSI 운영기준, 국회 제출자료, 정보보호 공시]
    basis: [덱 슬라이드 15 ①, KEV×NVD 30일내 악용 증가, FSC 10-14]

  - id: test_scope
    num: 11
    group: testing
    name_ko: 테스트 범위
    name_en: Test scope
    question: 인증 범위 밖 외부접점(브로커·영업지원 등)까지 테스트하는가
    levels:
      - {level: 0, label_ko: 증거 없음, criterion: 테스트 범위에 대한 공개 근거 없음}
      - {level: 1, label_ko: 언급, criterion: 주요 시스템을 점검한다고 언급}
      - {level: 2, label_ko: 구체, criterion: 외부접점·주변 시스템을 범위에 포함한다고 구체화}
      - {level: 3, label_ko: 검증, criterion: 전체 외부접점 테스트가 확인(사고 경로가 커버되었는가)}
    public_evidence_sources: [사고 경위(침입 경로), 인증 범위 공개, 보도]
    basis: [덱 슬라이드 9·15 ②(3개 은행 모두 주변 시스템으로 침입), FSC 10-14 외부접점 의무화]

  - id: test_followup
    num: 12
    group: testing
    name_ko: 사후조치
    name_en: Remediation follow-up
    question: 발견한 취약점을 기한 내 조치하고 재점검하는가
    levels:
      - {level: 0, label_ko: 증거 없음, criterion: 취약점 사후조치에 대한 공개 근거 없음}
      - {level: 1, label_ko: 언급, criterion: 보완조치 계획을 세운다고 언급}
      - {level: 2, label_ko: 구체, criterion: 패치 기한·재점검 절차가 구체화}
      - {level: 3, label_ko: 검증, criterion: 기한 내 조치·재점검 완료가 수치로 확인(미조치 건수 등)}
    public_evidence_sources: [FSS 미조치 취약점 자료, 제재 공개안(패치 미실시)]
    basis: [덱 슬라이드 15 ③(109건 미조치), CISA BOD 22-01(패치 기한), EFSR 제37조의2]

  - id: test_coverage
    num: 13
    group: testing
    name_ko: AI 활용·공동훈련
    name_en: AI coverage / joint drills
    question: 테스트에 AI를 쓰는가, 소규모 기관은 공동훈련으로 보완하는가
    levels:
      - {level: 0, label_ko: 증거 없음, criterion: AI 활용·공동훈련에 대한 공개 근거 없음}
      - {level: 1, label_ko: 언급, criterion: AI 보안 활용 의향을 언급}
      - {level: 2, label_ko: 구체, criterion: AI 기반 테스트·공동훈련 참여를 구체화}
      - {level: 3, label_ko: 검증, criterion: AI 테스트·공동훈련 수행이 수치로 확인(78건 중 9건 등)}
    public_evidence_sources: [국회 제출자료(AI 활용 침투테스트 수), FSI 공동훈련]
    basis: [덱 슬라이드 15 ④(지역·특수은행 1/26), 금보원 공동훈련]

  # ── response: 사고 대응 (슬라이드 4·5) ──
  - id: detection_time
    num: 14
    group: response
    name_ko: 탐지 소요시간
    name_en: Detection latency
    question: 공격 시작부터 인지까지 걸린 시간을 알 수 있고, 짧은가
    levels:
      - {level: 0, label_ko: 증거 없음, criterion: 탐지 시점에 대한 공개 근거 없음}
      - {level: 1, label_ko: 언급, criterion: 모니터링 체계가 있다고 언급}
      - {level: 2, label_ko: 구체, criterion: 탐지 소요시간이 공개됨(시간 단위)}
      - {level: 3, label_ko: 검증, criterion: 짧은 탐지시간이 사고 경위·국회자료로 확인}
    public_evidence_sources: [사고 경위 발표, 국회 제출 탐지시간 자료]
