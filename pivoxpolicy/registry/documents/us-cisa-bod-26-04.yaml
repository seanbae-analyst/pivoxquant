summary: "연방 민간기관(FCEB) 대상 — 민간 금융사엔 적용 안 됨. BOD 22-01(KEV)·BOD 19-02 를 대체·폐지. 취약점마다 4변수(외부 노출 · KEV 등재 · 공격 자동화 가능 · 기술적 영향)로 조치 기한을 정한다(Table 1, 달력일): 3일 + 포렌식 트리아지 / 3일 / 14일 / 60일 / 시스템 업그레이드 때. 가장 급한 줄 = KEV 등재 + 자동화 가능 + 완전 장악(노출 여부 무관) 3일. 배경 문단이 '공격자의 AI 사용이 패치 공개와 악용 사이의 시간을 더 줄일 수 있다' 고 적고, CISA 가 매 회계연도 기한을 데이터로 재평가한다. 덱 제안 ② '패치 기한' 의 현행 선례. 위탁 환경(FedRAMP·CSP) 시스템의 인벤토리·준수 확인을 기관 책임으로 둔다."
