  - id: krx-algo-gl-4-3
    doc: 한국거래소 시장감시위원회 알고리즘거래 위험관리 가이드라인
    article: 4.3 ①
    force: guideline
    quote: "거래소에 호가가 제출되기 전에 회원 자체적으로 금액기준 주문한도를 사전에 설정하여 시스템에 적용하여야 한다."
    quote_verified: secondary
    source: https://www.smallake.kr/wp-content/uploads/2016/01/20160124_111425.pdf
    requires: 호가가 거래소에 가기 전에 금액 기준 주문한도를 시스템에 설정한다.
    when: {activities_any: [order]}
    control: least_privilege
    layer: agent
    note: 2014.11 가이드라인의 사본에서 읽었다. 지금도 유효한지는 확인하지 못했다. 자동화된 주문 시스템을 직접 다루므로 AI까지로 셌다.
    owner: 준법감시인
