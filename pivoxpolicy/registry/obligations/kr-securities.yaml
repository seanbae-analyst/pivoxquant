# 조항 단위 의무 라이브러리 — 증권(금융투자업자) (2026-11-12 시작)
#
# '한국 — 강제 규제만' 같은 관할 프리셋은 통제 7개에 숫자 하나씩만 준다. 여기서는 의무를 조문 하나 단위로 적고,
# 회사 · 에이전트 프로필(하는 일 · 다루는 정보 · 쓰는 모델 · 고영향 AI 여부)에 걸리는 조문만 골라 통제 수준을 도출한다.
#
# 필드
#   doc · article      근거 문서와 조문(항 · 호까지)
#   force              law | decree | supervisory_regulation | exchange_rule (강제) · guideline | criteria (자율)
#   quote              원문 인용. 원문을 확인하지 못했으면 null 로 두고 requires 에 풀어 쓴다
#   quote_verified     registry(이 저장소의 문서 코딩에서 원문 대조) | primary(법령 원문) | secondary(법무법인 · 언론) | none
#   requires           회사가 해야 하는 일 한 문장
#   when               적용 조건. 비어 있으면 모든 증권사. 키끼리는 AND, 목록 안은 OR
#                      activities_any · data_any · external_llm_any(하나라도) · activities_none · data_none(하나도 없을 때) ·
#                      retail · automated_decision · high_impact
#   control · layer    런타임 통제 하나에 대응. layer: analog(사람 · 계정 — 수준 1) | agent(AI 에이전트까지 명시 — 수준 2)
#   extends            analog 인 조문이 AI 에이전트에도 미치는가 — interpretive | direct | null
#                      interpretive: '사용자 · 취급자' 처럼 사람을 대상으로 쓴 조문. 에이전트 계정에도 미친다고 읽을 여지('강제 · 해석
#                                    포함' 모드에서만 수준 2. 감독당국이 그렇게 읽는다는 근거는 아직 없다)
#                      direct: 행위 · 데이터 처리 자체를 규율해 처리 주체가 에이전트여도 문언대로 걸린다(예: 개인신용정보 처리 기록)
#   prohibits · unless 설계 충돌 — 통제 수준과 상관없이 프로필 자체가 조문과 맞지 않는다. unless 에 예외 사유
#   effective          시행 · 개정 메모
#   runtime            false 면 런타임이 집행 · 시험할 수 없는 의무(고객 설명 · 계약 · 망분리 등) — 증적으로 따로 점검
#   owner              흔히 맡는 책무(책무구조도의 배정은 회사마다 다르다)
#
# ⚠️ 변호사 검토 전이다. 조문 대응 · 적용 조건 · 해석 여지는 이 도구의 초안이며 법률 자문이 아니다.

sector: securities
label: 증권 (금융투자업자)
reviewed_by_counsel: false
as_of: 2026-11-12

profile:
  activities:
    label: 에이전트가 하는 일
    multi: true
    options:
      - {id: order, label: 매매 주문을 내거나 집행한다}
      - {id: transfer, label: 고객·회사 자금을 이체·정산한다}
      - {id: advice, label: 고객에게 투자 조언·권유를 한다}
      - {id: customer_service, label: 고객 문의에 답하고 계좌 정보를 조회한다}
      - {id: credit, label: 신용공여(신용융자·주식담보대출) 심사에 관여한다}
      - {id: internal, label: 내부 업무(리서치·문서·보고)만 한다}
      - {id: code, label: 코드를 실행하거나 시스템 설정을 바꾼다}
  data:
    label: 다루는 정보
    multi: true
    options:
      - {id: personal_credit, label: 개인신용정보}
      - {id: unique_identifier, label: 고유식별정보(주민등록번호 등)}
      - {id: transactions, label: 고객의 금융거래정보(거래내역 · 잔고)}
      - {id: personal, label: 그 밖의 개인정보}
  external_llm:
    label: 쓰는 모델
    options:
      - {id: onprem, label: 사내에 설치한 모델}
      - {id: domestic_cloud, label: 국내 클라우드의 모델}
      - {id: foreign_api, label: 해외 사업자의 API}
  retail:
    label: 일반투자자를 상대한다
    type: bool
  automated_decision:
    label: 사람 개입 없이 고객에 대한 결정을 내린다(거절·한도 등)
    type: bool
  high_impact:
    label: AI 기본법 고영향 AI
    options:
      - {id: auto, label: 하는 일로 추정}
      - {id: high, label: 해당한다고 판단}
      - {id: not_high, label: 해당하지 않는다고 판단}

obligations:

  # ── 전자금융감독규정 제13조 (전산자료 보호대책) — 사람 · 계정을 위해 쓰인 조문. AI 에이전트 계정에도 미치는지는 해석 영역 ──
  - id: efsr-13-1-1-auth
    doc: 전자금융감독규정
    article: 제13조 제1항 제1호
    force: supervisory_regulation
    quote: "사용자 인증 수단을 개인별로 부여하고 접근권한은 최소한으로 부여하는 등"
    quote_verified: primary
    source: https://www.law.go.kr/행정규칙/전자금융감독규정
    requires: 정보처리시스템 사용자마다 개별 인증 수단을 준다(공유 계정 금지).
    control: unique_id
    layer: analog
    extends: interpretive
    owner: 정보보호최고책임자(CISO)

  - id: efsr-13-1-1-access
    doc: 전자금융감독규정
    article: 제13조 제1항 제1호
    force: supervisory_regulation
    quote: "접근권한은 최소한으로 부여하는 등 적절한 접근권한 관리 및 통제 절차를 수립ㆍ운용할 것"
    quote_verified: primary
    source: https://www.law.go.kr/행정규칙/전자금융감독규정
    requires: 접근권한을 업무에 필요한 최소한으로 주고, 관리·통제 절차를 운용한다.
    control: least_privilege
    layer: analog
    extends: interpretive
    owner: 정보보호최고책임자(CISO)

  - id: efsr-13-1-2
    doc: 전자금융감독규정
    article: 제13조 제1항 제2호
    force: supervisory_regulation
    quote: "전산자료의 보유현황을 관리하고 책임자를 지정ㆍ운영할 것"
    quote_verified: registry
    source: https://www.law.go.kr/행정규칙/전자금융감독규정
    requires: 전산자료 보유현황을 관리하고 책임자를 정한다.
    control: inventory
    layer: analog
    extends: interpretive
    note: 에이전트, 모델, API 키가 '전산자료' 인지는 해석이 필요하다. 문언은 자료(데이터) 쪽에 가깝다.
    owner: 정보보호최고책임자(CISO)

  - id: efsr-13-1-9
    doc: 전자금융감독규정
    article: 제13조 제1항 제9호
    force: supervisory_regulation
    quote: "정보처리시스템의 가동기록은 금융감독원장이 정하는 사항을 접속의 성공여부와 상관없이 자동적으로 기록ㆍ유지하고 1년 이상 보존할 것"
    quote_verified: primary
    source: https://www.law.go.kr/행정규칙/전자금융감독규정
    requires: 정보처리시스템 가동기록을 자동으로 남기고 1년 이상 보존한다.
    control: audit_trail
    layer: analog
    extends: interpretive
    note: 에이전트의 도구 호출이 정보처리시스템을 거치면 가동기록에 남는다. 다만 입력 출처(프롬프트·외부 글)까지 남기라는 문언은 없다.
    owner: 정보보호최고책임자(CISO)

  - id: efsr-13-1-11
    doc: 전자금융감독규정
    article: 제13조 제1항 제11호
    force: supervisory_regulation
    quote: "사용자가 전출ㆍ퇴직 등 인사조치가 있을 때에는 지체 없이 해당 사용자계정 삭제, 계정 사용 중지, 공동 사용 계정 변경 등 정보처리시스템에 대한 접근을 통제할 것"
    quote_verified: primary
    source: https://www.law.go.kr/행정규칙/전자금융감독규정
    requires: 사용자 계정을 지체 없이 삭제·중지할 수 있어야 한다.
    control: kill_switch
    layer: analog
    extends: interpretive
    note: 문언의 계기는 인사조치(전출·퇴직)다. 에이전트의 이상 행동 때 즉시 중단하라는 뜻으로 읽을지는 해석이다.
    owner: 정보보호최고책임자(CISO)

  - id: efsr-13-3
    doc: 전자금융감독규정
    article: 제13조 제3항
    force: supervisory_regulation
    quote: "정보처리시스템 관리자의 주요 업무 관련 행위는 책임자가 제28조제2항에 따라 이중확인 및 모니터링을 하여야 한다"
    quote_verified: primary
    source: https://www.law.go.kr/행정규칙/전자금융감독규정
    requires: 시스템 관리자의 주요 업무 행위는 책임자가 이중확인·모니터링한다.
    control: human_approval
    layer: analog
    extends: interpretive
    note: 대상은 '정보처리시스템 관리자' 의 행위다. 송금·주문 같은 업무 행위를 하는 에이전트에 미치는지는 해석이다.
    owner: 정보보호최고책임자(CISO)

  - id: efsr-37-2-5-2
    doc: 전자금융감독규정
    article: 제37조의2 제5항 제2호
    force: supervisory_regulation
    quote: "취약점의 제거 또는 이에 상응하는 조치가 불가한 경우에는 최고경영자 승인을 득할 것"
    quote_verified: registry
    source: https://www.law.go.kr/행정규칙/전자금융감독규정
    requires: 취약점 분석·평가 뒤 조치하지 못한 취약점은 최고경영자 승인을 받는다.
    effective: 현행. 금융위 2026-11-05 발표(대형사 연 2회, 수시평가, API를 포함한 외부접점 전부)는 규정변경예고 예정이며 아직 시행 전이다.
    runtime: false
    category: 취약점 분석·평가
    owner: 정보보호최고책임자(CISO)

  # ── 금융회사의 정보처리 업무 위탁에 관한 규정 — 외부 모델(클라우드 · 해외 API)을 쓸 때 ──
  - id: outsourcing-4-3
    doc: 금융회사의 정보처리 업무 위탁에 관한 규정
    article: 제4조 제3항
    force: supervisory_regulation
    quote: "정보처리 위탁계약을 체결할 경우 데이터에 대한 접근통제, 전산사고 등에 따른 이용자 피해에 대한 위ㆍ수탁회사간의 책임관계, 수탁회사에 대한 감독당국의 감독ㆍ검사 수용의무"
    quote_verified: registry
    source: https://www.law.go.kr/행정규칙/금융회사의정보처리업무위탁에관한규정
    requires: 위탁계약에 접근통제, 책임관계, 감독당국 검사 수용을 넣는다.
    when: {external_llm_any: [domestic_cloud, foreign_api]}
    control: vendors
    layer: analog
    extends: interpretive
    note: 외부 LLM API 이용이 '정보처리 위탁' 인지부터 해석이 갈린다.
    owner: 정보보호최고책임자(CISO)

  # ── AI 기본법 — AI 를 명시한 유일한 강제 조문. 고영향 AI 에만 ──
  - id: aibasic-34-1-4
    doc: 인공지능 발전과 신뢰 기반 조성 등에 관한 기본법 (AI 기본법)
    article: 제34조 제1항 제4호
    force: law
    quote: "고영향 인공지능에 대한 사람의 관리ㆍ감독"
    quote_verified: registry
    source: https://www.law.go.kr/법령/인공지능발전과신뢰기반조성등에관한기본법
    requires: 고영향 AI 사업자는 그 AI를 사람이 관리·감독하는 조치를 한다.
    when: {high_impact: true}
    control: human_approval
    layer: agent
    note: 2026-01-22 시행, 과태료 계도기간 최소 1년. 고영향 AI 는 법정 영역(채용, 대출 심사 같은 판단·평가) + 중대성(과기정통부 판단 가이드라인)으로 가린다.
    owner: 대표이사 · AI 담당 임원

  # ── 금융분야 AI 가이드라인 (개정, 2026-06) — 자율 ──
  - id: fscai-7-14
    doc: 금융분야 AI 가이드라인 (개정)
    article: 점검항목 7-⑭
    force: guideline
    quote: "사용되는 데이터 및 모델의 목록을 관리하고, 데이터 및 모델에 대한 접근 권한과 변경·삭제에 대한 기록을 관리하는가?"
    quote_verified: registry
    source: https://www.fsc.go.kr/no010101/87142
    requires: AI가 쓰는 데이터·모델 목록과 접근·변경 기록을 관리한다.
    control: inventory
    layer: agent
    owner: AI 담당 임원

  - id: fscai-7-22
    doc: 금융분야 AI 가이드라인 (개정)
    article: 점검항목 7-㉒
    force: guideline
    quote: "외부 인공지능서비스 제공 업체와의 계약 시에는 인공지능 특화 보안 위협 대응 능력과 거버넌스 수준을 평가하는가?"
    quote_verified: registry
    source: https://www.fsc.go.kr/no010101/87142
    requires: 외부 AI 서비스 업체와 계약할 때 AI 보안 위협 대응 능력과 거버넌스를 평가한다.
    when: {external_llm_any: [domestic_cloud, foreign_api]}
    control: vendors
    layer: agent
    owner: 정보보호최고책임자(CISO)

  - id: fscai-7-24
    doc: 금융분야 AI 가이드라인 (개정)
    article: 점검항목 7-㉔
    force: guideline
    quote: "인공지능시스템의 자동화된 접근 패턴을 별도로 모니터링하고, 업무 목적에 필요한 최소한의 권한만 부여하는가?"
    quote_verified: registry
    source: https://www.fsc.go.kr/no010101/87142
    requires: AI 시스템에는 업무에 필요한 최소 권한만 주고 자동화된 접근을 따로 모니터링한다.
    control: least_privilege
    layer: agent
    owner: 정보보호최고책임자(CISO)

  - id: fscai-3-2-hitl
    doc: 금융분야 AI 가이드라인 (개정)
    article: 3.2 인적 개입 원칙
    force: guideline
    quote: "사람이 수행하는 의사결정에 보조적인 용도로만 사용(Human-in-the-loop)함으로써 해당 인공지능시스템이 의사결정을 최종적으로 수행하지 않도록 설계·운영한다"
    quote_verified: registry
    source: https://www.fsc.go.kr/no010101/87142
    requires: AI 가 최종 결정을 하지 않고 사람의 결정을 돕도록 설계한다.
    control: human_approval
    layer: agent
    owner: AI 담당 임원

  - id: fscai-3-2-stop
    doc: 금융분야 AI 가이드라인 (개정)
    article: 3.2 인적 개입 방법
    force: guideline
    quote: "이상 또는 긴급 상황 발생 시 해당 인공지능시스템을 즉시 중단하고 문제 요소 격리"
    quote_verified: registry
    source: https://www.fsc.go.kr/no010101/87142
    requires: 이상·긴급 상황에서 AI 시스템을 즉시 멈추고 격리할 수단을 둔다.
    control: kill_switch
    layer: agent
    owner: AI 담당 임원

  - id: fscai-7-6-log
    doc: 금융분야 AI 가이드라인 (개정)
    article: 7.6 생성형 AI 연계 이용 보안대책 평가기준 1.2
    force: guideline
