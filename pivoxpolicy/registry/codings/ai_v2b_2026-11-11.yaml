items:
  "eu-ai-act-art14":
    inventory:
      analog: {covered: false}
      agent: {covered: false, subject: null}
      note: "Scope Art. 14 only; all obligations target high-risk AI systems (not agent-named), so subject=ai. analog all false: no human/account/general-IT target. audit_trail false: Art.14 requires monitoring/understanding, no log/record duty. vendors false: provider-to-deployer provision is not due-diligence/contract/monitoring of third parties. 14(5) two-person confirmation is also human_approval for AI output (agent)."
    vendors:
      analog: {covered: false}
      agent: {covered: false, subject: null}
    unique_id:
      analog: {covered: false}
      agent: {covered: false, subject: null}
    least_privilege:
      analog: {covered: false}
      agent: {covered: false, subject: null}
    human_approval:
      analog: {covered: false}
      agent: {covered: true, subject: ai, evidence: "Art. 14(4)(d): \"to decide, in any particular situation, not to use the high-risk AI system or to otherwise disregard, override or reverse the output of the high-risk AI system\""}
    audit_trail:
      analog: {covered: false}
      agent: {covered: false, subject: null}
    kill_switch:
      analog: {covered: false}
      agent: {covered: true, subject: ai, evidence: "Art. 14(4)(e): \"to intervene in the operation of the high-risk AI system or interrupt the system through a ‘stop’ button or a similar procedure that allows the system to come to a halt in a safe state\""}
  "intl-fsb-ai-sound-practices-2026-10":
    inventory:
      analog: {covered: false}
      agent: {covered: true, subject: ai, evidence: "SP3 (PAGE 29): \"Financial institutions leverage existing processes and repositories, such as use case and model inventories, third-party registries, or systems registry.\""}
      note: "Final report read in full for SP1-12 and Annex (sec 1 overview skimmed as background). borderline: analog audit_trail rests on general-ICT 'monitoring and logging of anomalies and cyber incidents' (AI-threat hardening of general IT, G3). Analog false by close reading: inventory (documenting Internet-connected systems is not a maintained list), vendors (all third-party text targets AI providers), unique_id (IAM/MFA named only as topics), least_privilege, human_approval, kill_switch. strong: agent unique_id/least_privilege/human_approval/audit_trail/kill_switch all at agent level. borderline: agent inventory is documentation + 'use case and model inventories' (agent-specific attributes only in a case study)."
    vendors:
      analog: {covered: false}
      agent: {covered: true, subject: agent, evidence: "SP12 (PAGE 65): \"including liability for actions taken by highly autonomous AI agents\""}
    unique_id:
      analog: {covered: false}
      agent: {covered: true, subject: agent, evidence: "SP3 (PAGE 30): \"Visibility assigns individual unique identifiers to each AI agent so that financial institutions can see which actions it took\""}
    least_privilege:
      analog: {covered: false}
      agent: {covered: true, subject: agent, evidence: "SP11 (PAGE 63): \"Financial institutions adapt ICT controls to agents, including Identity and Access Management (IAM) and least privilege, which grants agents the minimum permissions needed to achieve their goals\""}
    human_approval:
      analog: {covered: false}
      agent: {covered: true, subject: agent, evidence: "SP10 (PAGE 56): \"setting clear, risk-based triggers for when an agent must seek human approval, confirmation or review\""}
    audit_trail:
      analog: {covered: true, evidence: "SP11 (PAGE 60): \"enhancing monitoring and logging of anomalies and cyber incidents with controls on data provenance, cross-validation of datasets and model behaviour tracking.\""}
      agent: {covered: true, subject: agent, evidence: "SP3 (PAGE 30): \"In the case of agentic AI, financial institutions establish effective record-keeping to enable them to: attribute actions (decisions, intermediate steps, escalation to a human\""}
    kill_switch:
      analog: {covered: false}
      agent: {covered: true, subject: agent, evidence: "SP10 (PAGE 57): \"implementing and testing risk-based ‘kill-switch’ mechanisms to pause, limit, override or remove an agent's access to systems\""}
  "intl-fsb-ai-sound-practices-consultation-2026-06":
    inventory:
      analog: {covered: false}
      agent: {covered: true, subject: ai, evidence: "SP3 (PAGE 26): \"This may leverage existing processes like use case and model inventory, third-party or systems registry, etc.\""}
      note: "Consultation draft read in full for SP1-12 and Annexes. borderline: analog audit_trail rests on general-ICT 'monitoring and logging of anomalies and cyber incidents' (G3 hardening of general IT). Analog false for the other six (same reasoning as final report). strong: agent human_approval (human approval or dual authorisation for transactions above a value). borderline: agent inventory is AI-use-case documentation referencing inventories; kill_switch subject=ai since the 'Kill switch' form is defined for AI operations generally."
    vendors:
      analog: {covered: false}
      agent: {covered: true, subject: ai, evidence: "SP12 (PAGE 52): \"conduct appropriate due diligence on prospective third-party AI providers\""}
    unique_id:
      analog: {covered: false}
      agent: {covered: true, subject: agent, evidence: "SP10 (PAGE 47): \"assigning and documenting individual identifiers to AI agents to facilitate monitoring and identity management\""}
    least_privilege:
      analog: {covered: false}
      agent: {covered: true, subject: agent, evidence: "SP11 (PAGE 49): \"applying the principle of ‘least privilege’ to AI agents and their sub-agents (giving them the minimum permissions and access controls necessary to accomplish their tasks)\""}
    human_approval:
      analog: {covered: false}
      agent: {covered: true, subject: agent, evidence: "SP10 (PAGE 47): \"placing boundaries on AI agents, such as defining actions that are prohibited or that require human approval at appropriate checkpoints\""}
    audit_trail:
      analog: {covered: true, evidence: "SP11 (PAGE 49): \"enhancing monitoring and logging of anomalies and cyber incidents with controls on data provenance, cross-validation of datasets, and model behaviour tracking.\""}
      agent: {covered: true, subject: agent, evidence: "SP10 (PAGE 47): \"and maintaining audit trails of agent transactions\""}
    kill_switch:
      analog: {covered: false}
      agent: {covered: true, subject: ai, evidence: "SP10 (PAGE 46): \"‘Kill switch’: mechanisms enabling human intervention to halt or constrain AI operations\""}
