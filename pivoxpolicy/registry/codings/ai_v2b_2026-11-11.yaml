  "kr-fsc-ai-guidelines-2026-06":
    inventory:
      analog: {covered: true, evidence: "7.7 망분리 대체 정보보호통제 \"접속 단말기 및 사용자ㆍ관리자 등록ㆍ관리, AIㆍSaaS 관리자 계정 등 다중 인증 방식 적용\""}
      agent: {covered: true, subject: ai, evidence: "7.3 점검 항목 ⑭ \"사용되는 데이터 및 모델의 목록을 관리하고, 데이터 및 모델에 대한 접근 권한과 변경·삭제에 대한 기록을 관리하는가?\""}
      note: "borderline: analog 는 AI·SaaS 이용 사용자·단말기 등록 관리 문언을 인사 명부류로 봄. strong: AI 모델·데이터 목록 + 접근권한·변경 기록."
    vendors:
      analog: {covered: true, evidence: "5.3 제3자 IT리스크 관리 \"금융회사가 정보처리를 수반한 업무를 제3자에게 위탁하는 경우 기본적으로 금융회사의 정보처리업무 위탁에 관한 규정을 따르도록 규율하고 있는바\""}
      agent: {covered: true, subject: ai, evidence: "7.4 점검 항목 ㉒ \"외부 인공지능서비스 제공 업체와의 계약 시에는 인공지능 특화 보안 위협 대응 능력과 거버넌스 수준을 평가하는가?\""}
    unique_id:
      analog: {covered: true, evidence: "7.7 망분리 대체 정보보호통제 \"API key, 관리자 계정 등 주요 인증정보에 대한 보호ㆍ점검 및 관리절차 수립\""}
      agent: {covered: false, subject: null}
      note: "borderline: analog 는 AI·SaaS 의 API key·관리자 계정 인증정보 관리절차. agent false: AI 에 고유 식별자 부여·귀속 요구 없음(준수 사례의 서비스 계정 키 보관은 자격증명 보관)."
    least_privilege:
      analog: {covered: true, evidence: "7.7 망분리 대체 정보보호통제 \"AIㆍSaaS 관리자 계정 등 다중 인증 방식 적용, 최소 권한 부여 등 접근 제어 및 권한 관리\""}
      agent: {covered: true, subject: ai, evidence: "7.5 점검 항목 ㉔ \"인공지능시스템의 자동화된 접근 패턴을 별도로 모니터링하고, 업무 목적에 필요한 최소한의 권한만 부여하는가?\""}
      note: "agent: 자동화된 접근 패턴 모니터링+최소 권한(㉔) 및 모델·학습데이터 접근통제 강화."
    human_approval:
      analog: {covered: true, evidence: "7.5 준수 사례 \"접근 권한 그룹을 세분화하고, 접근 시 사용자 인증 및 승인을 받도록 하였다.\""}
      agent: {covered: true, subject: ai, evidence: "3. 점검 항목 ⑥ \"고위험 인공지능에 대해서는 최종 의사결정을 인공지능이 수행하지 않도록 하는 HITL(Human-in-the-Loop) 방식이 적용되어 있는가?\""}
      note: "borderline: analog 는 준수 사례의 접근·운영 이관 승인. strong: HITL·override·최종 의사결정 임직원."
    audit_trail:
      analog: {covered: true, evidence: "7.7 망분리 대체 정보보호통제 \"접속ㆍ이용 내역, 관리자 활동, 이상행위 등에 대한 모니터링 및 로그 수집(1년 이상 보존)\""}
      agent: {covered: true, subject: ai, evidence: "7.6 생성형 인공지능 연계 이용 보안대책 평가 기준 1.2 \"해당 생성형 인공지능서비스 입출력 데이터 로그(입출력 데이터 내역 포함)를 기록하고\""}
      note: "agent 근거 외 3.2 의 인적 개입 결과 사후 추적 가능한 로그 보존도 있음."
    kill_switch:
      analog: {covered: true, evidence: "7.2 준수 사례 \"프롬프트 인젝션 시도가 5회 이상 탐지된 사용자에게 경고하고, 10회 이상 시도 시 30분간 자동 차단하는 정책을 적용하였다.\""}
      agent: {covered: true, subject: ai, evidence: "3.2 인적 개입 방법 표 \"이상 또는 긴급 상황 발생 시 해당 인공지능시스템을 즉시 중단하고 문제 요소 격리\""}
      note: "strong: agent 는 긴급정지 기능 필수 적용(Kill switch) 표. borderline: analog 는 준수 사례의 사용자 자동 차단."
