# 코더용 빈 양식 — 코드북 v2 (두 층). 복사해서 codings/<이름>.yaml 로 저장하고 채운다.
#
# 판정 기준은 registry/controls.yaml 하나다 — 층 정의(layers) · 공통 규칙 G1~G8(rules) · 통제별 true_if / false_if.
# 읽을 원문은 고정 코퍼스(문서 id 마다 텍스트 한 개 · snapshots/corpus.json 에 출처와 sha256). 다른 코더의 코딩을 보지 않고 채운다.
# 아래 문서 21건이 코퍼스 전부다. ISO/IEC 27001 · 42001 은 원문이 유료라 코퍼스에 없다 — 코딩하지 않는다.
#
# 통제마다 두 층을 따로 적는다:
#   analog — 일반 통제: 조항의 대상이 사람·계정·일반 정보시스템/자산·제3자 일반
#   agent  — AI·에이전트 적용: 조항의 대상이 AI 시스템·모델·AI 에이전트
#   covered: true 다룸 / false 다루지 않음 / null 원문을 못 읽음(안 봄)
#   evidence: covered true 면 필수 — 위치(조·항·호, 절, 통제 ID, 쪽) + 원문 그대로의 인용
#   subject (agent 층만): covered true 면 agent(근거 조항이 AI 에이전트를 명시) 또는 ai(AI 시스템·모델 일반), 아니면 null
#   note: 경계 사례는 "borderline:" 으로 시작
#
# 구속력(binding)은 documents/*.yaml 에 있고 코더가 정하지 않는다. 점수는 층마다 자동 계산된다 (pivoxpolicy/schema.py).
# 다 채우면:  python3 -m pivoxpolicy.cli check  →  python3 -m pivoxpolicy.cli kappa <이름> <다른 코더>
