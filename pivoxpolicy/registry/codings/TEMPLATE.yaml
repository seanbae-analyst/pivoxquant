# 두 번째 코더용 템플릿. 복사해서 codings/<이름>.yaml 로 저장하고 채운다.
#
# covered:  true  — 문서가 이 통제를 (사람이든 에이전트든 대상으로) 요구·권고한다
#           false — 다루지 않는다
#           null  — 아직 안 봤다 (매트릭스에서 '코딩 필요'로 집계)
# evidence: covered true 면 필수 — 조문·항목 번호·쪽. "~라고 함" 같은 2차 인용이면 그렇게 적는다.
#
# 문서의 binding·names_agents 는 documents/*.yaml 에 있고 코더가 바꾸지 않는다.
# 셀 점수 = covered × (binding, names_agents) 로 자동 계산된다 (pivoxpolicy/schema.py).
coder: CODER_NAME
coded_at: 2026-01-01
basis: 원문 직접 독해 / 2차 자료 / 덱 노트 중 무엇을 봤는지
provisional: true
items:
  kr-efsr-art13:
    inventory:       {covered: null, evidence: ""}
    vendors:         {covered: null, evidence: ""}
    unique_id:       {covered: null, evidence: ""}
    least_privilege: {covered: null, evidence: ""}
    human_approval:  {covered: null, evidence: ""}
    audit_trail:     {covered: null, evidence: ""}
    kill_switch:     {covered: null, evidence: ""}
