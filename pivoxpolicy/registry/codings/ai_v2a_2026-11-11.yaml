  "eu-ai-act-art14":
    inventory:
      analog: {covered: false}
      agent: {covered: false, subject: null}
      note: "Art 14 only: all analog false (every clause targets high-risk AI systems). Agent true only for human_approval (14(4)(d), 14(5)) and kill_switch (14(4)(e)); subject ai (no agentic AI named). Close but false: 14(4)(a) monitoring operation is not logging; no inventory/ID/privilege/vendor text."
    vendors:
      analog: {covered: false}
      agent: {covered: false, subject: null}
    unique_id:
      analog: {covered: false}
