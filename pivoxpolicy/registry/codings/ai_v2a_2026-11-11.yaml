  "kr-fsc-ai-guidelines-2026-06":
    inventory:
      analog: {covered: false}
      agent: {covered: true, subject: ai, evidence: "PAGE 90 점검항목 7-⑭ \"사용되는 데이터 및 모델의 목록을 관리하고, 데이터 및 모델에 대한 접근 권한과 변경·삭제에 대한 기록을 관리하는가?\""}
      note: "agent: 7.3 데이터·모델 목록 관리, 준수사례의 모델 목록(담당자 포함), 7.1 자산 목록 사례. analog borderline: AI 자산 목록이 중심이라 agent 근거로 보고 일반 자산 목록 요구는 없다고 판단해 false."
    vendors:
      analog: {covered: true, evidence: "PAGE 90 점검항목 5-④ \"제3자의 영향도 및 의존도 등을 파악할 수 있도록 위탁하는 정보, 시스템 현황, 중요도 등 제3자의 IT 현황 관리 등록부를 마련하고 최신 상태로 유지하고 있는가?\""}
      agent: {covered: true, subject: ai, evidence: "PAGE 90 점검항목 7-㉒ \"외부 인공지능서비스 제공 업체와의 계약 시에는 인공지능 특화 보안 위협 대응 능력과 거버넌스 수준을 평가하는가?\""}
      note: "agent: 5.3·7.4·㉒. analog borderline: 5.3 의 클라우드 CSP 안전성 평가·정보처리 위탁 규정 준수·제3자 등록부는 AI 와 무관한 일반 위탁 규정의 재진술 성격."
    unique_id:
      analog: {covered: true, evidence: "PAGE 88 망분리 대체 정보보호통제 \"API key, 관리자 계정 등 주요 인증정보에 대한 보호ㆍ점검 및 관리절차 수립\""}
      agent: {covered: false, subject: null}
      note: "analog borderline: 망분리 대체통제의 API key·관리자 계정 인증정보 관리와 사용자·관리자 등록·관리 서술(신원 관리 해석). agent: 서비스 계정 키 보관 사례는 자격증명 보호이지 AI 에 대한 식별자 부여가 아니라 false."
    least_privilege:
      analog: {covered: true, evidence: "PAGE 77 7.3 준수 사례 \"개발자에게는 모델 읽기·쓰기 권한을, 평가자에게는 읽기 권한을, 운영자에게는 배포 권한만을 부여하고 분기별로 권한을 검토하였다\""}
      agent: {covered: true, subject: ai, evidence: "PAGE 90 점검항목 7-㉔ \"인공지능시스템의 자동화된 접근 패턴을 별도로 모니터링하고, 업무 목적에 필요한 최소한의 권한만 부여하는가?\""}
      note: "analog: 사람(개발자·평가자·운영자)의 모델 접근권한 최소화·분기 검토(G3 대상이 사람). agent borderline: 7.5 '인공지능시스템의 자동화된 접근 패턴 … 최소한의 권한' — 에이전트 명시는 없음."
    human_approval:
      analog: {covered: true, evidence: "PAGE 82 7.5 준수 사례 \"접근 권한 그룹을 세분화하고, 접근 시 사용자 인증 및 승인을 받도록 하였다\""}
      agent: {covered: true, subject: ai, evidence: "3.2 인적 개입 원칙 \"사람이 수행하는 의사결정에 보조적인 용도로만 사용(Human-in-the-loop)함으로써 해당 인공지능시스템이 의사결정을 최종적으로 수행하지 않도록 설계·운영한다\""}
      note: "agent: 보조수단성 원칙 HITL, 고위험 AI 복수인 확인·override. analog borderline: 모델·학습 데이터 저장소 접근 시 승인(7.5 사례)."
