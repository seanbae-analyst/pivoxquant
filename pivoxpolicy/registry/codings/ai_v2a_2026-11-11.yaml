    human_approval:
      analog: {covered: false}
      agent: {covered: true, subject: ai, evidence: "Article 14(4)(d): \"to decide, in any particular situation, not to use the high-risk AI system or to otherwise disregard, override or reverse the output of the high-risk AI system\""}
    audit_trail:
      analog: {covered: false}
      agent: {covered: false, subject: null}
    kill_switch:
      analog: {covered: false}
      agent: {covered: true, subject: ai, evidence: "Article 14(4)(e): \"to intervene in the operation of the high-risk AI system or interrupt the system through a ‘stop’ button or a similar procedure that allows the system to come to a halt in a safe state\""}
  "intl-fsb-ai-sound-practices-2026-10":
    inventory:
      analog: {covered: true, evidence: "SP11 (PDF p.60): \"documenting which systems are connected to the Internet and whether these connections are necessary for functionality;\""}
      agent: {covered: true, subject: ai, evidence: "SP3 (PDF p.29): \"Financial institutions leverage existing processes and repositories, such as use case and model inventories, third-party registries, or systems registry.\""}
      note: "borderline: analog true rests only on documenting Internet-connected systems (SP11); AI model inventories counted in agent layer. strong: agent-level inventory attributes (identifiers, tools, certified scope) appear in the case study (PDF pp.30-31), norm text names AI use cases generally."
    vendors:
      analog: {covered: false}
      agent: {covered: true, subject: agent, evidence: "SP12 (PDF p.65): \"contractual arrangements clarify accountability for model performance, model drift, service degradation, version updates and service discontinuity, including liability for actions taken by highly autonomous AI agents.\""}
      note: "Analog false: section 3.9 is expressly third-party AI risk; no general-vendor clause. Agent also has due diligence, monitoring/audit rights, change notification."
    unique_id:
      analog: {covered: false}
      agent: {covered: true, subject: agent, evidence: "SP3 (PDF p.30): \"Visibility assigns individual unique identifiers to each AI agent so that financial institutions can see which actions it took and which humans configured and oversaw it.\""}
      note: "strong: unique agent IDs linked to configuring/overseeing humans. Analog false: IAM/MFA only named for general systems (strength/topic only)."
    least_privilege:
      analog: {covered: false}
      agent: {covered: true, subject: agent, evidence: "SP11 (PDF p.63): \"Financial institutions adapt ICT controls to agents, including Identity and Access Management (IAM) and least privilege, which grants agents the minimum permissions needed to achieve their goals\""}
      note: "strong: least agency, scoped authority, isolated environments (SP10). Analog false: no least-privilege text for people/accounts."
    human_approval:
      analog: {covered: false}
      agent: {covered: true, subject: agent, evidence: "SP10 (PDF p.56): \"setting clear, risk-based triggers for when an agent must seek human approval, confirmation or review.\""}
      note: "strong: risk-based approval triggers for agents plus human-in-the-loop/in-command forms. Analog false: approvals mentioned (credit risk committee, staged approvals) concern AI models/use cases."
    audit_trail:
      analog: {covered: true, evidence: "SP11 (PDF p.60): \"enhancing monitoring and logging of anomalies and cyber incidents with controls on data provenance, cross-validation of datasets and model behaviour tracking.\""}
      agent: {covered: true, subject: agent, evidence: "SP3 (PDF p.30): \"financial institutions establish effective record-keeping to enable them to: attribute actions (decisions, intermediate steps, escalation to a human, interactions with the external environment etc.) to specific agents\""}
      note: "borderline: analog true rests on general anomaly/incident logging in SP11 (mixed with AI model tracking). strong: agent traceability (trigger, info/tools accessed, steps, permissions); lifecycle records protected from modification/deletion."
    kill_switch:
      analog: {covered: false}
      agent: {covered: true, subject: agent, evidence: "SP10 (PDF p.57): \"implementing and testing risk-based ‘kill-switch’ mechanisms to pause, limit, override or remove an agent's access to systems, tools, databases or decision-making functions where appropriate.\""}
      note: "strong: tested kill-switch that removes agent access. Analog false: no account suspension/isolation requirement for people or general assets."
  "intl-fsb-ai-sound-practices-consultation-2026-06":
    inventory:
      analog: {covered: true, evidence: "SP11 (PDF p.49): \"documenting which systems are connected to the Internet and whether these connections are necessary for functionality; and\""}
      agent: {covered: true, subject: ai, evidence: "SP3 (PDF p.26): \"This may leverage existing processes like use case and model inventory, third-party or systems registry, etc.\""}
      note: "borderline: analog true rests only on documenting Internet-connected systems (SP11). Agent: AI use-case documentation/inventory; agent-specific inventory attributes only in the case study (PDF p.27)."
    vendors:
      analog: {covered: false}
      agent: {covered: true, subject: ai, evidence: "SP12 (PDF p.52): \"conduct appropriate due diligence on prospective third-party AI providers;\""}
      note: "Analog false: section 3.9 is third-party AI only. Agent also has contract terms with monitoring/audit rights."
    unique_id:
      analog: {covered: false}
