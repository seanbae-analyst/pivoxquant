  "us-nist-ir-8596-cyber-ai-profile":
    inventory:
      analog: {covered: true, evidence: "PAGE 45, ID.AM-01 (CSF Core): \"ID.AM-01: Inventories of hardware managed by the organization are maintained\" / PAGE 45, ID.AM-02 (CSF Core): \"ID.AM-02: Inventories of software, services, and systems managed by the organization are maintained\""}
      agent: {covered: true, subject: agent, evidence: "PAGE 45, ID.AM-02 (Defend): \"Inventories should include AI models, APIs, keys, agents, data (see also ID.AM- 07), and their integrations and permissions.\""}
      note: "strong: (agent) 목록에 agents·keys·integrations·permissions(접근권한)까지 넣으라고 함 — owner 등록 문언은 없음. analog 근거는 Profile 표의 CSF Core 성과문(ID.AM-01/02, 우선순위 부여 + 'Standard cybersecurity practices apply'); ID.AM-04(공급자 서비스 목록)는 vendors 로 봄."
    vendors:
      analog: {covered: true, evidence: "PAGE 41, GV.SC-05 (CSF Core): \"GV.SC-05: Requirements to address cybersecurity risks in supply chains are established, prioritized, and integrated into contracts and other types of agreements with suppliers and other relevant third parties\" / PAGE 47, ID.AM-04 (Thwart): \"inventories enable tracking and management of services provided by suppliers and third parties who may be affected by, or the cause of, AI-enabled attacks.\""}
      agent: {covered: true, subject: ai, evidence: "PAGE 42, GV.SC-06 (Defend): \"Before adopting a third-party AI solution, conduct AI-specific due diligence and adversarial testing to assess model vulnerabilities, ethical alignment, and performance impact.\" / PAGE 41, GV.SC-05 (Defend): \"Require vendors to disclose both model and data scope, as well as incident support for AI tools.\""}
      note: "agent: GV.SC-07 Defend(공급자 제공 AI 모델·데이터셋·API 상시 모니터링), GV.SC-08 Defend(AI 모델·데이터 공급자를 사고대응 계획에 포함)도 있음 — 취약점 통지·로그 제공을 계약에 적으라는 문언은 없음. analog 는 GV.SC CSF Core 성과문과 Secure/Thwart 의 'Standard cybersecurity practices apply' 고려사항."
    unique_id:
      analog: {covered: true, evidence: "PAGE 60, PR.AA-01 (CSF Core): \"PR.AA-01: Identities and credentials for authorized users, services, and hardware are managed by the organization\" / PAGE 71–72, PR.IR-01 (Thwart): \"Defenses should prioritize additional layers of security for endpoint detection systems and credential and\" [쪽 넘김] \"identity management such as MFA and Zero-Trust architectures.\""}
      agent: {covered: true, subject: agent, evidence: "PAGE 61, PR.AA-03 (Defend): \"Assign each AI agent with a unique identity and credentials and treat them with the same security precautions as privileged users.\" / PAGE 60, PR.AA-01 (General Considerations): \"Give AI systems unique and traceable identities and credentials to better track their activity.\""}
      note: "strong: (agent) 에이전트마다 고유 신원·자격증명 + 행위 추적성(PR.AA-01 Secure 'traceability between AI systems and their actions') + 책임자 지정(GV.RR-02 'A human is assigned responsibility for the actions of an AI system') — 공유·직원 계정 금지는 'their own identities and credentials (i.e., AI service level accounts)' 수준이고 명시 금지는 없음."
    least_privilege:
      analog: {covered: true, evidence: "PAGE 62, PR.AA-05 (CSF Core): \"PR.AA-05: Access permissions, entitlements, and authorizations are defined in a policy, managed, enforced, and reviewed, and incorporate the principles of least privilege and separation of duties\" / PAGE 62, PR.AA-05 (Thwart): \"Maintain robust policies for access controls and authorizations\""}
      agent: {covered: true, subject: agent, evidence: "PAGE 62, PR.AA-05 (General Considerations): \"Apply the principle of least privilege to AI agents by granting only the permissions necessary to carry out their role.\" / PAGE 70, PR.PS-05 (Secure): \"AI agent systems are sometimes allowed to execute arbitrary code. In most applications, this ability should be curtailed, sandboxed, subject to approval and monitoring, or completely disallowed.\""}
      note: "agent: PR.IR-01(AI 의 네트워크 접근을 least privilege 로 제한), PR.AA-05 Defend(에이전트 권한 주기 검토)도 있음 — 신뢰할 수 없는 입력에 따른 출처 기반 차단 규칙은 없음. analog 의 least privilege 문언은 CSF Core 성과문(Thwart 우선순위 1)에 있고 Thwart 고려사항 자체는 접근통제 정책 유지."
    human_approval:
      analog: {covered: false}
      agent: {covered: true, subject: agent, evidence: "PAGE 70, PR.PS-05 (Secure): \"AI agent systems are sometimes allowed to execute arbitrary code. In most applications, this ability should be curtailed, sandboxed, subject to approval and monitoring, or completely disallowed.\" / PAGE 71, PR.IR-01 (Defend): \"Gate AI-initiated network changes and privilege use by implementing human approval or policy-based checks.\""}
      note: "strong: (agent) 고위험 행위(임의 코드 실행, 네트워크 변경·특권 사용)에 승인 게이트를 두고 RS.CO-02 Defend 는 자동 발송과 사람 검토를 가르는 기준을 정하라고 함; GV.PO-01·GV.OC-05 Defend 의 HITL 검증도 있음. analog false: 승인 문언은 모두 AI 행위 대상이고 ID.RA-07(변경·예외 관리)·PR.PS-05(비인가 SW 차단)·RC.CO-04('approved methods')에는 책임자의 개별 건 사전 승인 요구가 없음."
    audit_trail:
      analog: {covered: true, evidence: "PAGE 69, PR.PS-04 (CSF Core): \"PR.PS-04: Log records are generated and made available for continuous monitoring\" / PAGE 70, PR.PS-04 (Thwart): \"monitoring and logging will be needed to identify new patterns of AI-enabled tactics and techniques for detection and defense.\""}
      agent: {covered: true, subject: ai, evidence: "PAGE 87, RS.AN-07 (Defend): \"Preserve logs, inputs, outputs, and decision chains of AI systems to ensure provenance and improving future AI-driven response actions.\" / PAGE 60, PR.AA-01 (Secure): \"Organizations need traceability between AI systems and their actions.\""}
      note: "strong: (agent) logs·inputs·outputs·decision chains 보존과 provenance 까지 요구; PR.PS-04 Defend('Logs should show request data, response data'), DE.CM-01 Secure(AI 트래픽을 따로 tracked, logged), DE.CM-06 General 도 있음 — 도구 호출 기록은 명시 안 됨."
    kill_switch:
