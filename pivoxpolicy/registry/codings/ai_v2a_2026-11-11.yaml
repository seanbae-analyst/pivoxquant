      note: "Analog false: IAM/MFA only named as measures (strength/topic only)."
    least_privilege:
      analog: {covered: false}
      agent: {covered: true, subject: agent, evidence: "SP11 (PDF p.49): \"applying the principle of ‘least privilege’ to AI agents and their sub-agents (giving them the minimum permissions and access controls necessary to accomplish their tasks).\""}
      note: "Analog false: no least-privilege text for people/accounts."
    human_approval:
      analog: {covered: false}
      agent: {covered: true, subject: agent, evidence: "SP10 (PDF p.47): \"placing boundaries on AI agents, such as defining actions that are prohibited or that require human approval at appropriate checkpoints\""}
      note: "strong: dual authorisation for agent transactions above a value, human intermediation for payment execution. Analog false: no per-case approval for people/general systems."
    audit_trail:
      analog: {covered: true, evidence: "SP11 (PDF p.49): \"enhancing monitoring and logging of anomalies and cyber incidents with controls on data provenance, cross-validation of datasets, and model behaviour tracking.\""}
      agent: {covered: true, subject: agent, evidence: "SP10 (PDF p.47): \"and maintaining audit trails of agent transactions.\""}
      note: "borderline: analog true rests on general anomaly/incident logging in SP11. Agent also: monitoring/documenting agent process, tool access, reasoning at decision points (PDF p.48)."
    kill_switch:
      analog: {covered: false}
      agent: {covered: true, subject: ai, evidence: "SP10 (PDF p.46): \"mechanisms enabling human intervention to halt or constrain AI operations, ranging from complete shutdown\""}
      note: "borderline: kill switch listed as a common form of human oversight for AI generally (subject ai, no agent-specific kill-switch testing as in the final report). Analog false."
