# 2026-11-12: eu-dora-2022-2554 를 같은 팀 이름의 새 블라인드 에이전트가 추가 코딩 — 코드북은 '2026-11-12 조정' 5줄이 들어간 판(이 팀의 나머지 21건보다 나중).
# 두 층 코딩(코드북 v2) — AI 코더 ai_v2a_2026-11-11. 판정 기준은 registry/controls.yaml, 원문은 고정 코퍼스(snapshots/corpus.json).
# 배치 4개(KR · US1 · US2 · EU/INTL)를 서로 독립된 에이전트가 코딩했다. 다른 팀의 결과·이전 코딩·문서 요약을 보지 않았고 웹도 쓰지 않았다.
# 두 팀(ai_v2a · ai_v2b)은 같은 모델 계열이다 — 둘 사이 κ 는 '같은 코드북을 두 번 독립 적용했을 때의 재현성' 이지 사람 코더 간 신뢰도가 아니다.
# ISO/IEC 27001 · 42001 은 원문이 유료라 코퍼스에 없다 — null(미코딩).
coder: "ai_v2a_2026-11-11"
coded_at: "2026-11-11"
