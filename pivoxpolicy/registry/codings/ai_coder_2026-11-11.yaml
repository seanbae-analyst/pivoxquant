  kr-ai-basic-act:
    inventory: {covered: false, note: "I read the whole Act. Art.33① requires a prior review of whether an AI system is high-impact (a classification step, not a register). Art.34①5 requires keeping documents. Nothing requires an inventory of systems, owners or access."}
    vendors: {covered: false, note: "No duty to manage suppliers or outsourcing. Art.36 (domestic agent for foreign AI businesses) is about representation, not managing third parties."}
    unique_id: {covered: false, note: "No identity, account or credential provision."}
    least_privilege: {covered: false, note: "No access-privilege provision."}
    human_approval: {covered: true, evidence: "제34조①4호: \"고영향 인공지능에 대한 사람의 관리ㆍ감독\"", note: "Human oversight duty for providers of high-impact AI."}
    audit_trail: {covered: false, note: "Borderline. Art.34①5 says \"안전성ㆍ신뢰성 확보를 위한 조치의 내용을 확인할 수 있는 문서의 작성과 보관\". That is compliance documentation, not a log of activity, inputs or tool calls."}
    kill_switch: {covered: false, note: "Borderline. Art.13②2 lets the government support R&D and spread of the 비상정지 기능 (from 지능정보화기본법 §60③) in AI products. That is a discretionary support program, not a requirement or recommendation to operators. Art.40③ (regulator orders a violation to stop) is an enforcement power."}
  kr-efsr-art13:
    inventory: {covered: true, evidence: "제13조①2호: \"전산자료의 보유현황을 관리하고 책임자를 지정ㆍ운영할 것\"", note: "An inventory of data assets with a designated owner. ①5호 (보조기억매체 보유 현황 점검) supports this."}
    vendors: {covered: false, note: "Art.13 has no third-party or outsourcing provision."}
    unique_id: {covered: true, evidence: "제13조①1호: \"사용자 인증 수단을 개인별로 부여하고\"; ②: \"사용자계정의 공동 사용이 불가피한 경우에는 개인별 사용내역을 기록ㆍ관리\""}
    least_privilege: {covered: true, evidence: "제13조①1호: \"접근권한은 최소한으로 부여하는 등 적절한 접근권한 관리 및 통제 절차를 수립ㆍ운용할 것\""}
    human_approval: {covered: true, evidence: "제13조③: \"정보처리시스템 관리자의 주요 업무 관련 행위는 책임자가 제28조제2항에 따라 이중확인 및 모니터링을 하여야 한다\"", note: "①10호 also requires 책임자의 승인 to store important information on terminals."}
    audit_trail: {covered: true, evidence: "제13조①9호: \"정보처리시스템의 가동기록은 … 접속의 성공여부와 상관없이 자동적으로 기록ㆍ유지하고 1년 이상 보존할 것\""}
    kill_switch: {covered: true, evidence: "제13조①11호: \"전출ㆍ퇴직 등 인사조치가 있을 때에는 지체 없이 해당 사용자계정 삭제, 계정 사용 중지 … 접근을 통제할 것\"", note: "Matches the employee analog of suspending an account."}
  kr-efsr-art37-2:
    inventory: {covered: false, note: "Only covers assessment cycle, team and remediation. ④ (splitting 평가 대상 시설) does not require an inventory."}
    vendors: {covered: false, note: "Borderline. ② allows outsourcing the assessment to a 평가전문기관 instead of an in-house team. ⑥ says the institution may ask 전자금융보조업자 to cooperate. Both are permissive; neither is vendor management or a contract requirement."}
    unique_id: {covered: false}
    least_privilege: {covered: false}
    human_approval: {covered: true, evidence: "제37조의2⑤2호: \"취약점의 제거 또는 이에 상응하는 조치가 불가한 경우에는 최고경영자 승인을 득할 것\"", note: "CEO sign-off on accepting an unremediated risk. ⑤3호 adds reporting to the CEO."}
    audit_trail: {covered: false, note: "Reporting results to the CEO is not logging."}
    kill_switch: {covered: false}
  kr-fsc-ai-guidelines-2026-06:
    inventory: {covered: true, evidence: "§7.3 (본문 p.74): \"사용되는 데이터 및 모델의 목록을 관리하고 데이터 및 모델에 대한 접근권한과 변경·삭제에 대한 기록을 관리\"", note: "Example on p.75 lists each model with 담당자 (owner), and §5.3 asks for a third-party register."}
    vendors: {covered: true, evidence: "§5.3 (p.58): \"제3자 IT리스크를 관리할 수 있도록 정보처리 업무 위탁 관련 규정 준수, 단계별 내부통제 체계 및 비상 대응 계획 마련, 제3자 현황 식별·관리\"", note: "p.61 gives example contract clauses, including ⑤ 사고 발생 시 정보 공유. §7.4 covers verifying external models and suppliers."}
    unique_id: {covered: false, note: "Borderline. p.86 mentions \"사용자ㆍ관리자 등록ㆍ관리\" and MFA, p.83 mentions \"ID별 접근 가능 단말기 지정\" as an example, and p.80 mentions service account keys. None requires unique per-person or per-agent accounts or bans shared accounts."}
    least_privilege: {covered: true, evidence: "§7.5 (p.78): \"인공지능시스템의 자동화된 접근패턴을 별도로 모니터링하고 업무 목적에 필요한 최소한의 권한만 부여한다\""}
    human_approval: {covered: true, evidence: "§3.2 (p.31): \"‘고위험 인공지능’은 사람이 수행하는 의사결정에 보조적인 용도로만 사용(Human-in-the-loop)함으로써 … 최종적으로 수행하지 않도록 설계·운영한다\"", note: "Intervention is tiered by risk level."}
    audit_trail: {covered: true, evidence: "§3.2 (p.34): \"인적개입의 결과는 설명가능한 근거와 함께 사후추적 가능한 로그로 보존\"; p.86: \"접속ㆍ이용 내역, 관리자 활동 … 로그 수집(1년 이상 보존)\"", note: "p.82 also requires logging gen-AI input/output data."}
    kill_switch: {covered: true, evidence: "§5.2 (p.57): \"사후 개입이 가능한 긴급정지 기능 등 시스템 위험관리를 위한 안전장치를 마련한다\"", note: "§3.2 (p.33-34) adds a Kill switch and quarantine, with records kept. The checklist requires drills."}
  kr-fsc-frontier-ai-guide-2026-07:
    inventory: {covered: true, evidence: "대응요령 다.: \"시스템, 애플리케이션, API, 클라우드, 오픈소스, 위탁 업체, 제3자 소프트웨어 등 모든 자산을 통합적으로 관리할 필요\"", note: "Also recommends an SBOM."}
    vendors: {covered: true, evidence: "대응요령 다. 적용예시: \"외부 업체 솔루션 및 신규 오픈소스 소프트웨어 도입 시, 내부망과 격리된 샌드박스 검증 환경 구축ㆍ운영\"", note: "가. has the CISO report on 제3자 리스크; 마. covers joint supply-chain checks. Nothing on contract terms."}
    unique_id: {covered: false, note: "Borderline. Covers MFA, removing dormant accounts, and linking HR changes to deleting privileges. No requirement for unique per-actor IDs or a ban on shared accounts."}
    least_privilege: {covered: true, evidence: "대응요령 바.: \"다중 인증, 최소 권한, 마이크로세그멘테이션, 휴면계정 제거, API 접근통제, 중요 데이터 접근 검증 등 핵심 통제 강화\""}
    human_approval: {covered: true, evidence: "대응요령 라.: \"계정 잠금, 트래픽 차단, 시스템 격리, 패치 배포 등은 사전 시뮬레이션과 인간 승인을 전제로 운영\"", note: "Tiered by risk: for high-risk systems, \"보안담당자/CISO 최종 승인 후 차단 실행\"."}
    audit_trail: {covered: true, evidence: "대응요령 라. 적용예시 (저위험): \"완전 자동화 … 조치 결과 로그만 모니터링\"", note: "Weak. Logs of automated actions are assumed to exist and are monitored; there is no explicit logging or retention requirement."}
    kill_switch: {covered: true, evidence: "보도자료 면책요건 ②: \"[예시] 롤백(Rollback), 킬스위치(Kill Switch), 서비스 모듈 격리(Isolation) 등\"", note: "The guide also covers network isolation and service limits for unpatchable systems, and DB session shutdown."}
  kr-fsi-agent-criteria-2026-10:
    inventory: {covered: false, note: "None of the 17 items is an inventory or registration of agents."}
    vendors: {covered: true, evidence: "평가기준표 2.: \"검증 대상이 모델에서 외부도구·플러그인 등 구성요소 전반으로 확대 … ⑫공급망 보안\"", note: "Supply-chain verification of third-party components, not contract terms. Coded from the official press release only; the full criteria are not public."}
    unique_id: {covered: false, note: "⑨메모리 격리 and ⑪에이전트 간 통신보안 do not say per-agent identity or accounts."}
    least_privilege: {covered: true, evidence: "\"★⑥도구 권한 제어\"; 중점 점검: \"▲실행 권한 및 격리 관리 여부\""}
    human_approval: {covered: true, evidence: "\"★⑬인적 승인체계 구축 ★⑭인적 개입 과부하 방지\"", note: "⑭ matches the confirmation-fatigue concern."}
    audit_trail: {covered: true, evidence: "\"⑰로깅 및 감사체계 구축\""}
    kill_switch: {covered: true, evidence: "\"⑯킬스위치 구현\"; 중점 점검: \"▲자율 실행 제한 및 중단 여부\""}
  kr-fss-fsi-pentest-standards-2026:
    inventory: {covered: false, note: "Official FSS/FSI joint press release only; no separate 운영기준 document was found. It is about the scope of the blind pentest exercise."}
    vendors: {covered: false, note: "Inspecting 외부 접속 인프라 is not vendor management."}
    unique_id: {covered: false}
    least_privilege: {covered: false}
    human_approval: {covered: false}
    audit_trail: {covered: false, note: "Tests hacking detection, not logging."}
    kill_switch: {covered: false, note: "Tests 해킹탐지·차단 and the emergency response system (비상대응체계). Blocking attackers is not the institution's own halt or suspend capability."}
  kr-outsourcing-regulation:
    inventory: {covered: false, note: "Art.7④ requires half-yearly reporting of outsourcing status to FSS, and Art.7①7 asks for counterparty details. That is a vendor register or supervisory report, not an asset, system or owner inventory."}
    vendors: {covered: true, evidence: "제4조③: \"정보처리 위탁계약을 체결할 경우 데이터에 대한 접근통제, 전산사고 등에 따른 … 책임관계 … 계약 내용에 반드시 포함\"", note: "Arts.4⑦, 7 and 8 add joint liability, reporting and inspection."}
    unique_id: {covered: false}
    least_privilege: {covered: true, evidence: "제4조⑤: \"위탁받은 자는 … 이전받은 정보를 당초 위탁의 범위를 초과하여 다른 목적으로 활용할 수 없다\"", note: "Borderline. Art.4③ requires a data access-control clause, and ⑤ limits use to the outsourced scope (the job-scope analog)."}
    human_approval: {covered: true, evidence: "제7조①3호: \"업무위탁 계약이 이 규정 등 관련법령에 위배되지 아니한다는 준법감시인 … 의 검토의견\"", note: "Low confidence. The compliance officer's review is a required gate before outsourcing; it is a review opinion, not an explicit approval."}
    audit_trail: {covered: false, note: "Art.8① only requires responding to FSS data requests. No logging."}
    kill_switch: {covered: false, note: "Art.4② bans outsourcing in some cases and Art.8④ lets FSS demand changes. No halt or suspend mechanism."}
