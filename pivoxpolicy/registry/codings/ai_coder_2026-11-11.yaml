    audit_trail: {covered: null, note: "Annex A not publicly available."}
    kill_switch: {covered: null, note: "Annex A not publicly available."}
  intl-iso-iec-42001-2023:
    inventory: {covered: null, note: "Public preview (to clause 4.4) silent; Annex A/B not public."}
    vendors: {covered: true, evidence: "Introduction, p.vi: 'processes for the management of suppliers, partners and third parties that provide or develop AI systems for the organization'", note: "Introduction only (public preview); Annex A supplier controls not readable."}
    unique_id: {covered: null, note: "Public preview silent; Annex A/B not public."}
    least_privilege: {covered: null, note: "Public preview silent; Annex A/B not public."}
    human_approval: {covered: null, note: "Public preview silent."}
    audit_trail: {covered: null, note: "Public preview silent; 3.18 'audit' is a management-system audit, not logging."}
