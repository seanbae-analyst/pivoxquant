# 2차 코딩 — ai_coder_2026-11-11. AI 코더(에이전트)가 1차 코딩을 보지 않고 원문을 받아 코딩했다.
# 같은 모델 계열이 1차(덱 노트 기반)와 2차(원문 기반)를 했으므로, κ 는 '입력이 다른 두 AI 판단의 일치' 이지
# 사람 코더 간 신뢰도가 아니다. 논문에는 사람 코더 1명을 더해 보고하는 것이 맞다.
coder: ai_coder_2026-11-11
coded_at: 2026-11-11
basis: "원문(법령·고시 원문, 공식 PDF·HWPX, 보도자료) — 1차 코딩·문서 요약을 보지 않은 블라인드 에이전트 3개(KR·US·EU/INTL)"
provisional: true
items:
  eu-ai-act-art14:
    inventory: {covered: false, note: "Art. 14 (paras 1-5) contains no requirement to register or inventory AI systems, access rights or owners."}
    vendors: {covered: false, note: "Borderline. Art. 14(3)(b)/(4) put design duties on the provider but do not require managing third parties or contract terms. Coded false."}
    unique_id: {covered: false, note: "No identifier or account requirement for users or systems in Art. 14."}
    least_privilege: {covered: false, note: "No access-limitation or permission-scoping requirement in Art. 14."}
    human_approval: {covered: true, evidence: "Art. 14(5): 'no action or decision is taken by the deployer ... unless that identification has been separately verified and confirmed by at least two natural persons'", note: "Two-person confirmation applies only to Annex III 1(a) (remote biometric identification); Art. 14(1) general oversight and 14(4)(d) (disregard, override or reverse output) back this up."}
    audit_trail: {covered: false, note: "Art. 14(4)(a) requires the ability to 'duly monitor its operation' but says nothing on logging; logging is Art. 12, outside the coded scope."}
    kill_switch: {covered: true, evidence: "Art. 14(4)(e): 'to intervene in the operation of the high-risk AI system or interrupt the system through a 'stop' button or a similar procedure'", note: "Halt 'in a safe state'. No periodic testing or access revocation required."}
  intl-fsb-ai-sound-practices-2026-10:
    inventory: {covered: true, evidence: "Sec. 2.3 (SP3), p.25: 'Financial institutions leverage existing processes and repositories, such as use case and model inventories, third-party registries, or systems registry.'", note: "Documentation items (p.25) include 'allocation of accountability (i.e. owner of the AI use case ...)'. Printed page numbers (PDF page minus 4)."}
    vendors: {covered: true, evidence: "Sec. 3.9 (SP12), p.60: 'include contractual terms with third-party AI providers that enable: effective oversight and risk management, including monitoring rights; access, audit and information rights'", note: "p.61 adds notification of material changes affecting AI behaviour and liability for autonomous agents' actions."}
    unique_id: {covered: true, evidence: "Sec. 2.3, p.26: 'Visibility assigns individual unique identifiers to each AI agent so that financial institutions can see which actions it took and which humans configured'", note: "Identifiers let agents 'be easily differentiated from human users and other ICT systems' (printed p.26 = PDF p.30)."}
    least_privilege: {covered: true, evidence: "Sec. 3.8 (SP11), p.59: 'adapt ICT controls to agents, including Identity and Access Management (IAM) and least privilege, which grants agents the minimum permissions needed to achieve their goals'", note: "p.60 zero trust and action-level authorisation; p.52 limit interaction with the external environment. No explicit untrusted-input/source rule."}
    human_approval: {covered: true, evidence: "Sec. 3.7 (SP10), p.52: 'setting clear, risk-based triggers for when an agent must seek human approval, confirmation or review. For example, before approving financial transactions above a certain value'", note: "Risk-based, not every action."}
    audit_trail: {covered: true, evidence: "Sec. 2.3, p.26: 'Traceability allows financial institutions to follow what a given AI agent did, including: what triggered the action; what information and tools it accessed'", note: "Records protected from manipulation / immutable (p.26)."}
    kill_switch: {covered: true, evidence: "Sec. 3.7, p.53: 'implementing and testing risk-based 'kill-switch' mechanisms to pause, limit, override or remove an agent's access to systems, tools, databases or decision-making functions'", note: "Covers halting, removing access and testing."}
  intl-fsb-ai-sound-practices-consultation-2026-06:
    inventory: {covered: true, evidence: "Sec. 2.3 (SP3), p.22: 'financial institutions track and document their AI use throughout the lifecycle. This may leverage existing processes like use case and model inventory'", note: "Use-case owner not named explicitly (unlike the final)."}
    vendors: {covered: true, evidence: "Sec. 3.9 (SP12), p.48: 'include terms and conditions in contracts with third-party AI providers that enable: effective oversight, including monitoring; access, audit, and information rights'"}
    unique_id: {covered: true, evidence: "Sec. 3.7, p.43: 'assigning and documenting individual identifiers to AI agents to facilitate monitoring and identity management'", note: "No explicit link to a responsible human here."}
    least_privilege: {covered: true, evidence: "Sec. 3.8 (SP11), p.45: 'applying the principle of 'least privilege' to AI agents and their sub-agents (giving them the minimum permissions and access controls necessary to accomplish their tasks)'", note: "p.43 restrict direct agent access to payment systems."}
    human_approval: {covered: true, evidence: "Sec. 3.7, p.43: 'defining actions that are prohibited or that require human approval at appropriate checkpoints (i.e. high risk actions ...)'", note: "p.43 also human approval or dual authorisation above a value."}
    audit_trail: {covered: true, evidence: "Sec. 2.3, p.23: 'deploy enhanced documentation and logging for GenAI and agentic AI use cases'. Sec. 3.7, p.43: 'maintaining audit trails of agent transactions'", note: "Less detailed than the final."}
    kill_switch: {covered: true, evidence: "Sec. 3.7 (SP10), p.42: ''Kill switch': mechanisms enabling human intervention to halt or constrain AI operations, ranging from complete shutdown'", note: "Listed as an option among forms of human oversight; no testing (unlike final p.53)."}
