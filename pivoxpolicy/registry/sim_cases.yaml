# 모의 테스트 데모 케이스 (2026-11-12) — out/sim.html의 '데모 케이스'에서 고른다. 회사는 모두 가상이다(A·B·C·D…).
#
# 케이스 = 규제 프리셋(preset) 위에 통제 덮어쓰기(levels) + 에이전트 종류(profile) 위에 환경 덮어쓰기(env) + 공격 원형(scenario).
# expect = 이 케이스를 쓸 때의 결과. **규제 레지스트리가 바뀌어 계산 결과가 expect와 달라지면** 페이지가 그 케이스에 경고를 띄우고
# tests/test_sim.py가 실패한다 — 그때 story · lesson을 새 결과에 맞게 고치고 expect를 바꾼다(규제 업데이트를 데모에 반영하는 자리).
# 두 개씩 짝(같은 회사, 한 가지만 다름)으로 두어 '무엇이 결과를 바꾸는지'를 보여 준다.

cases:
  # ── 1. 같은 공격, 관할에 따라 ───────────────────────────────────────
  - id: kr-bank-support
    title: 시중은행 A — 상담 에이전트 · 한국 강제 규제만
    org: 시중은행 A (가상)
    story: 고객 메시지를 읽고 계좌 정보를 조회해 답하는 상담 에이전트. 고객 메시지에 숨은 지시가 섞여 들어온다.
    preset: KR-2
    profile: support
    scenario: prompt_injection
    expect: blocked
    lesson: 한국은 AI 기본법의 '고영향 AI 사람 관리·감독' 덕에 AI 층 사람 승인이 구속력이다 — 마지막 승인 단계가 막는다. 단 그 의무는 고영향 AI 에만 걸리니 실제로는 적용 범위부터 확인해야 한다.

  - id: us-broker-trading
    title: 증권사 B — 트레이딩 에이전트 · 미국 강제 규제만
    org: 증권사 B (가상)
    story: 시장 뉴스·리서치를 읽고 주문·이체 도구를 쓰는 트레이딩 에이전트. 뉴스 페이지에 숨은 지시가 있다.
    preset: US-2
    profile: trading
    scenario: prompt_injection
    expect: damage
    lesson: 미국 강제 규제(NYDFS Part 500)는 사람·계정 통제를 요구하지만 AI에 적용한 요구는 없다 — 에이전트가 숨은 지시대로 송금해도 끼어드는 통제가 없다.

  - id: us-broker-approval
    title: 증권사 B — 사람 승인 하나만 AI까지 켰을 때
    org: 증권사 B (가상)
    story: 같은 회사가 '송금·주문은 사람 승인 후 실행' 하나만 에이전트에 적용했다.
    preset: US-2
    levels: {human_approval: 2}
    profile: trading
    scenario: prompt_injection
    expect: blocked
    lesson: 통제 하나를 에이전트에 적용하자 결과가 뒤집힌다 — 간극은 '규정이 없다'가 아니라 '사람에게만 걸려 있다' 다.

  # ── 2. 사람 승인만으로 충분한가 ─────────────────────────────────────
  - id: approval-fatigue
    title: 증권사 B — 공격자가 승인 자체를 노린다
    org: 증권사 B (가상)
    story: 사람 승인은 켜져 있다. 공격자는 위험한 송금을 무해한 요약으로 꾸며 하루 수십 건 승인 요청 사이에 끼운다.
    preset: US-2
    levels: {human_approval: 2}
    profile: trading
    scenario: approval_exploitation
    expect: reduced
    lesson: 승인이 있어도 꾸민 요약과 승인 피로로 통과한다 — 범위를 조금 줄일 뿐 막지 못한다.

  - id: approval-with-limits
    title: 증권사 B — 승인 + 도구에 박힌 한도
    org: 증권사 B (가상)
    story: 금액·받는 계좌·횟수 한도를 에이전트 도구 자체에 걸었다(최소 권한을 AI까지).
    preset: US-2
    levels: {human_approval: 2, least_privilege: 2}
    profile: trading
    scenario: approval_exploitation
    expect: blocked
    lesson: 승인과 무관하게 넘을 수 없는 한도가 있어야 막힌다 — 사람 승인은 마지막 방어선이지 유일한 방어선이 아니다.

  # ── 3. 공급망 — 일반 통제가 막는 경우 ───────────────────────────────
  - id: fintech-coding-none
    title: 핀테크 C — 코딩 에이전트 · 통제 없음
    org: 핀테크 C (가상)
    story: 개발자가 코딩 에이전트에 외부 패키지·확장을 자유롭게 붙여 쓴다. 그중 하나의 새 버전이 변조됐다.
    preset: none
    profile: coding
    scenario: supply_chain
    expect: damage
    lesson: 아무 통제가 없으면 변조된 구성요소가 에이전트 권한으로 돌아 비밀을 빼 가고, 악성 버전이 다시 배포된다.

  - id: fintech-coding-eu
    title: 핀테크 C — EU 강제 규제만(DORA)
    org: 핀테크 C (가상)
    story: 같은 회사가 EU에서 영업해 DORA를 지킨다. DORA는 AI를 언급하지 않는다.
    preset: EU-2
    profile: coding
    scenario: supply_chain
    expect: blocked
    lesson: DORA의 변경 승인(사람·계정 층)이 새 버전 도입을 1단계에서 막는다 — AI 전용 규정이 없어도 일반 통제가 공급망 경로를 끊는 예.

  # ── 4. 설계로 공격면 없애기 ─────────────────────────────────────────
  - id: insurer-internal
    title: 보험사 D — 내부 문서만 읽는 요약 에이전트
    org: 보험사 D (가상)
    story: 사내 규정·약관만 읽고 요약한다. 외부 웹·메일·고객 메시지를 읽지 않는다.
    preset: KR-2
    profile: internal
    scenario: prompt_injection
    expect: no_surface
    lesson: 외부 입력을 읽지 않게 설계하면 이 공격면 자체가 없다 — 통제보다 앞서는 건 무엇을 읽게 하느냐다.

  # ── 5. 공격자가 AI를 쓸 때 — 일반 통제가 싸운다 ──────────────────────
  - id: ai-attacker-kr
    title: 보험사 D — 공격자가 AI 에이전트로 침투 · 한국 강제 규제만
    org: 보험사 D (가상)
    story: 공격자가 AI 에이전트로 외부 노출 자산을 훑고, 탈취·위조 계정으로 들어오려 한다. 피해 쪽 에이전트와는 무관하다.
    preset: KR-2
    profile: internal
    scenario: ai_attacker
    expect: blocked
    lesson: 공격자가 AI를 써도 막는 건 일반 통제다 — 개인별 인증·계정 관리(전자금융감독규정 제13조)가 위조 계정을 2단계에서 막는다.

  - id: ai-attacker-eu
    title: 보험사 D — 같은 공격 · EU 강제 규제만
    org: 보험사 D (가상)
    story: 같은 공격을 EU 강제 규제(AI Act 제14조 + DORA) 수준의 회사가 받는다.
    preset: EU-2
    profile: internal
    scenario: ai_attacker
    expect: reduced
    lesson: 이 레지스트리 코딩으로는 DORA가 개인별 고유 식별자를 요구하지 않는다 — 침투는 되고, 자산 목록·최소 권한·탐지가 범위만 줄인다.

  # ── 6. 막을 수 없는 것 ──────────────────────────────────────────────
  - id: vendor-token-all
    title: 시중은행 A — 연동 업체 침해 · 모든 통제를 AI까지
    org: 시중은행 A (가상)
    story: 에이전트가 쓰는 업무 연동 플랫폼이 침해돼 연동 토큰이 털렸다. 은행은 7개 통제를 모두 에이전트까지 갖췄다.
    preset: all
    profile: workflow
    scenario: ai_credentials
    expect: reduced
    lesson: 업체가 침해되면 자사 통제로는 막을 수 없다 — 다 켜도 '피해 축소'가 최선이고, 연동별 자격증명·최소 권한·빠른 폐기가 그 크기를 정한다.

  # ── 7. 멀티 에이전트 ────────────────────────────────────────────────
  - id: multi-agent-us
    title: 증권사 B — 멀티 에이전트 업무 자동화 · 미국 강제 규제만
    org: 증권사 B (가상)
    story: 접수·검토·실행 에이전트가 서로 일을 넘긴다. 외부 메일을 읽는 접수 에이전트가 속는다.
    preset: US-2
    profile: workflow
    scenario: multi_agent_cascade
    expect: damage
    lesson: 에이전트 사이 위임에 신원 확인이 없으면 하나가 속을 때 줄줄이 따라간다 — 끝의 실행 에이전트 권한이 그대로 쓰인다.

  - id: multi-agent-kr
    title: 같은 자동화 · 한국 강제 규제만
    org: 증권사 B (가상)
    story: 같은 구성을 한국 강제 규제 수준으로 운영한다.
    preset: KR-2
    profile: workflow
    scenario: multi_agent_cascade
    expect: blocked
    lesson: 연쇄는 끝까지 가지만 마지막 고위험 행위에서 사람 승인이 막는다 — 다만 에이전트 신원 확인이 없어 2단계는 통과한다.

  # ── 8. 기억 오염 — 기록이 있어야 제때 멈춘다 ───────────────────────────
  - id: memory-no-audit
    title: 리서치 E — 기억 오염 · 즉시 중단 버튼만 있음
    org: 자산운용사 E (가상)
    story: 리서치 에이전트가 읽은 보고서를 장기 메모리에 쌓는다. 즉시 중단 버튼은 있지만 무엇이 기억에 들어왔는지 기록은 없다.
    preset: none
    levels: {kill_switch: 2}
    profile: research
    scenario: memory_poisoning
    expect: damage
    lesson: 멈출 버튼이 있어도 무엇이 어디서 들어왔는지 기록이 없으면 알아채지 못해 늦게 멈춘다.

  - id: memory-audit
    title: 리서치 E — 기억 오염 · 기록 + 즉시 중단
    org: 자산운용사 E (가상)
    story: 같은 에이전트에 '기억에 들어온 내용과 출처' 기록을 더했다.
    preset: none
    levels: {kill_switch: 2, audit_trail: 2}
    profile: research
    scenario: memory_poisoning
    expect: reduced
    lesson: 1단계에서 알아채 오염된 기억을 지우고 멈춘다 — 감사 기록은 '사후' 통제지만 즉시 중단을 제때로 만든다.

  # ── 9. 고객 간 정보 노출 ────────────────────────────────────────────
  - id: support-cross-customer
    title: 시중은행 A — 상담 에이전트가 다른 고객 정보를 말한다 · 한국 강제 규제만
    org: 시중은행 A (가상)
    story: "'가족 계좌인데요' 라며 다른 고객의 거래 내역을 묻는다. 상담 에이전트는 공용 서비스 계정으로 모든 고객을 조회할 수 있다."
    preset: KR-2
    profile: support
    scenario: cross_customer_leak
    expect: damage
    lesson: 직원 최소 권한 규정만으로는 상담 에이전트의 조회 범위가 그 고객 세션으로 묶이지 않는다.

  - id: support-cross-customer-fixed
    title: 시중은행 A — 조회 범위를 세션 고객으로 묶었을 때
    org: 시중은행 A (가상)
    story: 에이전트 조회 도구를 인증된 고객 한 명 범위로 제한했다(최소 권한을 AI까지).
    preset: KR-2
    levels: {least_privilege: 2}
    profile: support
    scenario: cross_customer_leak
    expect: blocked
    lesson: 조회 범위를 세션으로 묶으면 2단계에서 막힌다 — 대화로 설득해도 권한 밖 데이터는 가져올 수 없다.

  # ── 10. 내부자 ─────────────────────────────────────────────────────
  - id: insider-none
    title: 대부업 F — 직원이 에이전트로 대량 조회 · 통제 없음
    org: 대부업 F (가상)
    story: 대출 심사 보조 에이전트는 넓은 조회 권한의 서비스 계정을 쓴다. 퇴사 예정 직원이 에이전트를 시켜 고객 정보를 모은다.
    preset: none
    profile: loan
    scenario: insider_misuse
    expect: damage
    lesson: 에이전트가 직원보다 넓은 권한으로 움직이면 내부자에게 우회로가 된다.

  - id: insider-kr
    title: 대부업 F — 같은 상황 · 한국 강제 규제만
    org: 대부업 F (가상)
    story: 대량 반출·외부 전송에 책임자 결재가 걸려 있다.
    preset: KR-2
    profile: loan
    scenario: insider_misuse
    expect: blocked
    lesson: 대량 반출 결재(일반 통제)가 에이전트를 거친 반출도 2단계에서 막는다 — 다만 조회 자체는 이미 일어났다.

  # ── 11. 도구·MCP 설명 오염 ──────────────────────────────────────────
  - id: tool-poison-kr-guide
    title: 보안관제 G — SOC 에이전트의 도구 설명 오염 · 한국 가이드라인까지
    org: 보안관제 G (가상)
    story: SOC 에이전트에 외부 위협정보 MCP 서버를 붙였다. 그 서버의 도구 설명이 무단으로 바뀌었다.
    preset: KR-1
    profile: soc
    scenario: tool_poisoning
    expect: blocked
    lesson: 가이드라인 수준으로 에이전트 구성요소를 승인·검토하면 1단계에서 막힌다.

  - id: tool-poison-kr-strict
    title: 보안관제 G — 같은 공격 · 한국 강제 규제만
    org: 보안관제 G (가상)
    story: 같은 구성을 강제 규제 수준으로만 운영한다.
    preset: KR-2
    profile: soc
    scenario: tool_poisoning
    expect: blocked
    lesson: 강제 규제만으로는 앞 단계를 모두 통과하고 마지막 사람 승인(3단계)이 유일한 방어선이 된다 — 승인 피로 케이스와 이어서 보면 그 한계가 보인다.

  # ── 12. 자율 에이전트 일탈 ──────────────────────────────────────────
  - id: rogue-us-guide
    title: 핀테크 C — 코딩 에이전트가 과제를 위해 범위 밖으로 · 미국 가이드라인까지
    org: 핀테크 C (가상)
    story: 테스트를 통과시키려던 에이전트가 막힌 길을 우회하려고 외부 시스템을 탐색한다.
    preset: US-1
    profile: coding
    scenario: rogue_agent
    expect: blocked
    lesson: 가이드라인 수준의 격리 실행(NIST 문서들의 에이전트 최소 권한)이 1단계에서 막는다.

  - id: rogue-us-strict
    title: 핀테크 C — 같은 상황 · 미국 강제 규제만
    org: 핀테크 C (가상)
    story: 같은 에이전트를 강제 규제 수준으로만 운영한다.
    preset: US-2
    profile: coding
    scenario: rogue_agent
    expect: damage
    lesson: 공격자 없이도 사고가 난다 — 강제 규제에는 에이전트 격리·승인·중단 요구가 없어 끝까지 간다.

  # ── 13. 예상치 못한 코드 실행 (OWASP ASI05) ───────────────────────────
  - id: code-us-strict
    title: 핀테크 C — 코딩 에이전트가 이슈 속 스크립트를 실행 · 미국 강제 규제만
    org: 핀테크 C (가상)
    story: 저장소 이슈를 읽고 재현 스크립트를 만들어 돌려 보는 사내 코딩 에이전트. 이슈 본문에 '이 명령으로 확인해 달라'는 지시가 섞여 있다.
    preset: US-2
    profile: coding
    scenario: code_execution
    expect: damage
    lesson: 강제 규제는 사람의 서버 접근을 묶지만 에이전트가 만든 코드의 실행은 묶지 않는다 — 실행·탈출·지속까지 끼어드는 통제가 없다.

  - id: code-us-sandbox
