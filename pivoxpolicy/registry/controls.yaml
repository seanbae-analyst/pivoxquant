# 7개 에이전트 통제 — 직원 통제 생애주기(배치 전·사용 중·사후)를 에이전트에 1:1 로 대응시킨 것.
# 출처: 발표 덱(2026-11-01) 슬라이드 14. 7 은 표준이 아니라 매핑의 결과다.
#
# 점수 척도는 pivoxpolicy/schema.py 참조 (0 미다룸 · 1 자율 · 2 구속력 · 3 구속력+에이전트 명시).
controls:
  - id: inventory
    num: 1
    stage: before
    name_ko: 인벤토리
    name_en: Inventory
    employee_analog: 인사 명부 (HR roster)
    agent_requirement: 에이전트·접근권한·책임자(owner)를 등록

  - id: vendors
    num: 2
    stage: before
    name_ko: 공급자 관리
    name_en: Vendors / third-party
    employee_analog: 아웃소싱 계약
    agent_requirement: 취약점 통지·로그 제공을 계약에 명시

  - id: unique_id
    num: 3
    stage: in_use
    name_ko: 고유 식별자
    name_en: Unique ID
    employee_analog: 직원 ID
    agent_requirement: 에이전트별 계정 + 책임자 연결 (공유·직원 계정 금지)

  - id: least_privilege
    num: 4
    stage: in_use
    name_ko: 최소 권한
    name_en: Least privilege
    employee_analog: 직무 범위
    agent_requirement: 신뢰할 수 없는 입력이 섞이면 이체·외부 전송 차단 (출처 기반 규칙)

  - id: human_approval
    num: 5
    stage: in_use
    name_ko: 사람 승인
    name_en: Human approval
    employee_analog: 결재
    agent_requirement: 고위험 행위에만 승인 (모든 행위 승인은 confirmation fatigue)

  - id: audit_trail
    num: 6
    stage: after
    name_ko: 감사 기록
    name_en: Audit trail
    employee_analog: 접근 로그
    agent_requirement: 입력·출처·도구 호출을 기록 (답만으로는 원인을 못 찾는다)

  - id: kill_switch
    num: 7
    stage: after
    name_ko: 즉시 중단
    name_en: Kill switch
    employee_analog: 계정 정지
    agent_requirement: 즉시 중단 + 권한 회수, 정기 테스트

# 7개 통제 밖의 주제 태그 (문서의 topics 필드에 쓴다)
topics:
  - id: testing
    name_ko: 침투·모의 테스트 (빈도·범위·사후조치·공동훈련)
  - id: rating
    name_ko: 보안 등급·인증 제도
  - id: incident
    name_ko: 사고·사례
  - id: scope_exclusion
    name_ko: 에이전트를 범위에서 명시적으로 제외
  - id: governance
    name_ko: 거버넌스·원칙 (7개 통제보다 상위)
