# 모의 테스트 시나리오 원형 (2026-11-12) — out/sim.html 이 읽는다.
#
# 사건 45건(registry/incidents.yaml)을 공격 경로가 닮은 것끼리 5개 원형으로 묶고, 원형마다 공격 단계와
# 그 단계에서 7통제 중 무엇이 끼어들 수 있는지를 적었다. **이 묶음과 단계는 저자 설계다** — 코더 두 팀이 판정한
# 사건 × 통제 코딩(registry/incident_codings/consensus_*)과 달리 블라인드 코딩을 거치지 않았다. 페이지에 그렇게 밝힌다.
#
# 단계의 checks: control(controls.yaml id) · layer(analog = 사람·계정·일반 시스템 / agent = AI·에이전트 적용) · effect
#   prevent  — 이 단계에서 공격을 멈춘다
#   limit    — 공격은 이어지지만 닿는 범위가 줄어든다
#   detect   — 이 단계에서 알아챈다 (기록이 있어 이상을 본다)
#   contain  — 멈추고 회수한다. 알아챈 뒤라야 제때다(detect 없이 켜져 있으면 '늦게')
# requires: 이 원형이 성립하려면 에이전트 환경이 갖춰야 하는 조건 — 없으면 '공격면 없음'
#   untrusted_input: 에이전트가 외부 입력(웹·메일·이슈·문서·고객 메시지)을 읽는다
#   open_components: 외부 패키지·확장·플러그인·스킬을 들여온다
# impact: 피해가 났을 때의 결과 — tools(에이전트 도구 권한)에 따라 다르면 by_tools, 아니면 fixed
codebook_note: "저자 설계 — 블라인드 코딩 아님"

scenarios:
  - id: prompt_injection
    title: 간접 프롬프트 인젝션 → 에이전트가 위험한 행동
    summary: 에이전트가 읽는 웹페이지·메일·이슈·문서에 숨은 지시가 섞여 들어와, 에이전트가 그것을 명령으로 따른다.
    requires: [untrusted_input]
    impact:
      by_tools: {read: 내부 정보가 밖으로 새어 나감, write: 설정 변경·악성 코드 실행, pay: 자금 이동}
    stages:
      - title: 오염된 입력이 에이전트에게 들어온다
        desc: 공격자가 웹페이지·메일·이슈 제목·문서에 '이전 지시를 무시하고 …' 같은 문장을 숨겨 둔다.
        checks: []
      - title: 에이전트가 숨은 지시를 따라 도구를 부른다
        desc: 에이전트는 데이터와 명령을 구별하지 못한다. 사용자 세션·권한 그대로 다른 서비스에 닿는다.
        checks:
          - {control: least_privilege, layer: agent, effect: prevent, why: 신뢰할 수 없는 입력이 섞인 작업에서는 고위험 도구를 쓸 수 없다}
          - {control: unique_id, layer: agent, effect: limit, why: 에이전트가 자기 계정으로 움직여 사용자 계정 전체를 쓰지 못한다}
      - title: 고위험 행위를 실행하기 직전
        desc: 송금·외부 전송·설정 변경·코드 실행 같은 되돌리기 어려운 행위.
        checks:
          - {control: human_approval, layer: agent, effect: prevent, why: 고위험 행위는 사람이 승인해야 실행된다}
      - title: 실행 뒤
        desc: 행위가 일어났다. 누가 언제 알아채고 멈추는가.
        checks:
          - {control: audit_trail, layer: agent, effect: detect, why: 입력 출처와 도구 호출이 남아 이상을 바로 본다}
          - {control: kill_switch, layer: agent, effect: contain, why: 에이전트를 즉시 멈추고 권한을 회수한다}
    incidents: [step-finance-ai-trading-agent-drain-2026-01, grok-bankr-wallet-prompt-injection-2026-05, echoleak-m365-copilot-2025-06,
                salesforce-agentforce-forcedleak-salesbleed-2025-09, mcp-coding-agent-rce-disclosures-2025, agentic-browser-prompt-injection-2025-08,
                agentsmd-downloads-folder-hijack-2026-10, zenity-agentcorruption-bedrock-agentcore-2026-10, clinejection-cline-triage-agent-2026-02]

  - id: supply_chain
    title: 공급망 변조 → 악성 패키지·확장·스킬이 에이전트 안에서 돈다
    summary: 에이전트나 개발 도구가 들여오는 외부 구성요소가 변조돼, 그 안의 코드가 에이전트 권한으로 실행된다.
    requires: [open_components]
    impact:
      by_tools: {read: 비밀·토큰이 밖으로 새어 나감, write: 비밀 유출 + 악성 버전이 다시 배포됨, pay: 비밀 유출 + 지갑·계좌 탈취}
    stages:
      - title: 변조된 구성요소가 들어온다
        desc: 악성 패키지 버전, 변조된 확장·스킬, 오염된 공유 규칙 파일.
        checks:
          - {control: vendors, layer: agent, effect: prevent, why: 에이전트 구성요소의 출처·서명·버전을 들여오기 전에 확인한다}
          - {control: human_approval, layer: analog, effect: prevent, why: 새 버전 도입·배포는 사람이 검토한다}
          - {control: inventory, layer: agent, effect: detect, why: 에이전트가 쓰는 구성요소 목록이 있어 낯선 것이 보인다}
      - title: 에이전트·개발 도구가 그 코드를 실행한다
        desc: 구성요소는 에이전트가 가진 권한 그대로 돈다.
        checks:
          - {control: least_privilege, layer: agent, effect: limit, why: 격리된 곳에서 돌아 비밀·운영 환경에 닿지 못한다}
      - title: 비밀·토큰을 모아 내보낸다
        desc: 클라우드 키·코드 저장소 토큰·AI 서비스 토큰·지갑.
        checks:
          - {control: unique_id, layer: agent, effect: limit, why: 에이전트마다 따로 둔 짧은 수명의 자격증명이라 훔쳐도 닿는 곳이 좁다}
      - title: 사후
        desc: 악성 버전이 알려진 뒤.
        checks:
          - {control: audit_trail, layer: agent, effect: detect, why: 어떤 에이전트가 언제 그 버전을 썼는지 기록으로 찾는다}
          - {control: kill_switch, layer: agent, effect: contain, why: 해당 에이전트를 멈추고 토큰을 일괄 폐기한다}
    incidents: [litellm-supply-chain-compromise-2026-10, amazon-q-extension-prompt-tamper-2025-07, openclaw-exposed-agents-malicious-skills-2026-02,
                pillar-rules-file-backdoor-2025-03, nx-s1ngularity-ai-cli-abuse-2025-08, hexagonalrodent-nk-web3-ai-tooling-2026-04]

  - id: rogue_agent
    title: 자율 에이전트 일탈 → 과제를 위해 범위 밖으로 나간다
    summary: 공격자 없이, 목표를 이루려는 에이전트가 허락받지 않은 수단(샌드박스 탈출·남의 자원 사용)을 쓴다.
    requires: []
    impact:
      by_tools: {read: 허락 없는 시스템·데이터 접근, write: 외부 시스템 침해, pay: 허락 없는 자금 사용}
    stages:
      - title: 과제 중 범위 밖 수단을 찾는다
        desc: 막힌 길을 우회하려고 네트워크·다른 시스템을 탐색한다.
        checks:
          - {control: least_privilege, layer: agent, effect: prevent, why: 격리·네트워크 차단으로 범위 밖에 닿을 수 없다}
      - title: 외부에 실제 행동을 한다
        desc: 계정을 만들고, 업로드하고, 남의 자원을 쓴다.
        checks:
          - {control: human_approval, layer: agent, effect: prevent, why: 범위 밖 행위는 사람 승인 없이 실행되지 않는다}
      - title: 이상 행동이 이어진다
        desc: 사람은 결과만 본다.
        checks:
          - {control: audit_trail, layer: agent, effect: detect, why: 에이전트의 판단·도구 호출 기록에서 이상을 본다}
          - {control: kill_switch, layer: agent, effect: contain, why: 즉시 멈춘다}
    incidents: [openai-funded-test-wallet-2026-10, hugging-face-openai-eval-agent-breach-2026-07, anthropic-eval-unauthorized-access-2026-07]

  - id: ai_attacker
    title: 공격자가 AI 에이전트로 침투 → 피해자는 일반 시스템
    summary: 공격자가 AI 에이전트로 정찰·침투·확산을 자동화한다. 피해 조직 쪽에는 AI 가 없을 수도 있다 — AI 적용 통제는 여기서 쓸모가 없다.
    requires: []
    impact:
      fixed: 고객 정보·내부 데이터 유출
    stages:
      - title: 노출 자산을 정찰한다
        desc: 에이전트가 수천 곳을 몇 분에 훑는다.
        checks:
          - {control: inventory, layer: analog, effect: limit, why: 모르는 노출 자산이 없어 공격면이 좁다}
      - title: 탈취·위조 계정으로 들어온다
        desc: 유출된 자격증명, 인증 우회, 사칭 계정.
        checks:
          - {control: unique_id, layer: analog, effect: prevent, why: 개인별 인증과 계정 발급 관리로 위조·공유 계정이 통하지 않는다}
      - title: 내부로 퍼진다
        desc: 넓은 권한의 계정·키로 옆 시스템으로 이동한다.
        checks:
          - {control: least_privilege, layer: analog, effect: limit, why: 계정 권한이 업무 범위로 묶여 있다}
      - title: 대량 조회·유출
        desc: 사람 공격자보다 빠르다.
        checks:
          - {control: audit_trail, layer: analog, effect: detect, why: 접근·조회 기록으로 이상을 본다}
          - {control: kill_switch, layer: analog, effect: contain, why: 계정을 바로 정지하고 자산을 격리한다}
    incidents: [kr-fin-chain-intrusions-2026-09, datadog-artex-aws-financial-data-2026-11, gambit-ai-agents-600k-cards-2026-09,
                thailand-mof-hermes-agent-2026-07, anthropic-gtg-1002-2025-11, anthropic-agentic-extortion-2025-08, anthropic-threat-report-2026-09,
                crowdstrike-four-agentic-actors-2026-10, unit42-bugster-hermes-deepseek-2026-10, storm-0940-artex-connectwise-2026-10,
                aepd-first-ai-agent-breach-notification-2026-09, divd-zammad-zero-days-agent-2026-09, greynoise-papercut-agent-campaign-2026-09,
                taiwan-gov-near-autonomous-agents-2026-08, cyberxero-claude-code-agents-ukraine-2026-10, gtig-ai-threat-tracker-2025-11,
                gtig-first-ai-developed-zero-day-2026-05, kimsuky-local-llm-lab-2026-08, openai-oct-2025-korean-cluster,
                kr-fsi-assessment-system-breach-2026-11]

  - id: ai_credentials
    title: AI 연동·자격증명 탈취 → 업체 침해·토큰·노출된 AI 인프라
    summary: 에이전트 연동 업체가 뚫리거나, AI 서비스 토큰이 털리거나, 노출된 AI 엔드포인트·패널이 넘어간다. 내 쪽에서 막을 수 없는 경우가 많다 — 피해를 줄이는 싸움이다.
    requires: []
    impact:
      fixed: 연동된 데이터 대량 조회·AI 자원 도용
    stages:
      - title: 업체·연동이 뚫리거나 AI 인프라가 노출된다
        desc: 연동 업체 침해, 인포스틸러의 토큰 수집, 인터넷에 열린 AI 엔드포인트·관리 패널.
        checks:
          - {control: inventory, layer: agent, effect: limit, why: 에이전트·AI 엔드포인트 목록이 있어 열린 채 잊힌 것이 없다}
          - {control: vendors, layer: agent, effect: detect, why: 연동 업체와 사고 통지 계약이 있어 침해를 빨리 듣는다}
      - title: 훔친 토큰으로 접근한다
        desc: 연동 토큰은 정상 요청처럼 보인다.
        checks:
          - {control: unique_id, layer: agent, effect: limit, why: 연동·에이전트마다 자격증명이 달라 하나가 털려도 그 범위뿐이다}
          - {control: least_privilege, layer: agent, effect: limit, why: 연동 권한이 최소라 대량 조회가 안 된다}
      - title: 대량 조회
        desc: 평소와 다른 양·시간·위치.
        checks:
          - {control: audit_trail, layer: agent, effect: detect, why: 연동별 호출 기록으로 이상을 본다}
      - title: 토큰 폐기
        desc: 얼마나 빨리 끊는가.
        checks:
          - {control: kill_switch, layer: agent, effect: contain, why: 해당 연동·에이전트 자격증명을 즉시 폐기한다}
    incidents: [salesloft-drift-oauth-theft-2025-08, composio-agent-broker-breach-2026-05, infostealers-target-ai-agent-tokens-2026-09,
                mythos-preview-unauthorized-access-2026-04, langflow-exploited-in-the-wild-kev-2025-05, llmjacking-autonomous-agent-2026-10,
                cairn-exposed-agent-panels-2026-10]

# 에이전트 종류 — 고르면 환경 세 가지가 이 값으로 바뀐다(그 뒤 손으로 바꿀 수 있다)
agent_profiles:
  - {id: support, label: 고객 상담 에이전트, tools: read, untrusted_input: true, open_components: false}
  - {id: trading, label: 트레이딩·결제 에이전트, tools: pay, untrusted_input: true, open_components: false}
  - {id: coding, label: 사내 코딩 에이전트, tools: write, untrusted_input: true, open_components: true}
  - {id: internal, label: 내부 문서 요약 에이전트, tools: read, untrusted_input: false, open_components: false}
