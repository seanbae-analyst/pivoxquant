# 사건 × 통제 코드북 v2 (2026-11-12) — '이 사건에서 이 통제가 실패했나' 를 두 축으로 나눠 묻는다.
#
# v1(1차 related_controls · 2차 ai_coder_2026-11-11)은 통제마다 참/거짓 한 칸이었고 κ 0.42 였다.
# 불일치 70칸 중 감사 기록 20 · 즉시 중단 12 가 거의 전부 '1차만 참' — 1차는 '로그로 못 찾았다 · 오래 지속됐다' 류를 추론했고
# 2차는 원문이 그 실패를 적어야 참으로 봤다. 또 공격자가 AI 를 쓴 사건(18건)에서 '최소 권한 실패' 가
# 피해자의 일반 계정 얘기인지 AI 에이전트의 권한 얘기인지가 정해져 있지 않았다. 그래서 칸마다 둘을 따로 적는다:
#   level — stated(원문이 그 실패를 사실로 적음) / inferred(원문이 적은 사실에서 그 실패가 따라 나옴)
#   layer — agent(실패한 통제의 대상이 AI 시스템·에이전트) / analog(사람·계정·일반 시스템)
# κ 는 'stated 만' 과 'stated ∨ inferred' 두 수준, 층별로 낸다 (pivoxpolicy/agreement.py).
# 아래 규칙은 사건 유형으로만 쓴다 — 특정 사건을 이름 붙이면 κ 가 부풀려진다.
codebook_version: 2
# v2.2 (2026-11-12): '공급자 자신이 주인공이면 false' 를 '하류로 닿은 서술이 없을 때만 false' 로 좁혔다 — v2.1 에서 같은 유형(악성 패키지 배포)이 글의 초점에 따라 갈렸다.
# v2.1 (2026-11-12): vendors 규칙을 공급망 경로로 좁혔다 — 두 팀이 vendors 칸만 이 규칙으로 다시 코딩했다(registry/incident_codings 의 vendors_recoded).

question: >-
  이 사건에서, 사건을 가능하게 하거나 피해를 키운 쪽(피해 조직 · AI 시스템 운영자 · AI 공급자)의 이 통제가
  없었거나 실패했거나 우회됐는가. 공격자 쪽의 통제는 묻지 않는다.

levels:
  stated: 원문이 그 통제(또는 그 통제의 분명한 동의어)의 부재·실패·우회·오설정을 사실로 적었다. 인용이 그 문장이다.
  inferred: >-
    원문은 그 통제를 이름 붙이지 않았지만, 원문이 적은 구체적 사실(무엇이 어떻게 일어났나)에서 그 통제의 실패가 따라 나온다.
    인용은 그 사실 문장이고 reason 에 추론 한 줄을 적는다. '보통 이런 사건이면 …' 같은 일반론은 추론이 아니다 — false.

layers:
  agent: 실패한 통제의 대상이 AI 시스템·모델·에이전트(또는 그 도구·플러그인·자격증명)다 — 에이전트가 너무 많은 권한을 가졌다, 승인 없이 행동했다, 멈출 수 없었다 …
  analog: 실패한 통제의 대상이 사람·계정·일반 정보시스템·제3자 일반이다 — 탈취된 직원 계정, 패치 안 된 서버, 과한 IAM 권한, 노출된 관리 콘솔 …

rules:
  - id: R1
    title: 원문만
    text: >-
      코퍼스 파일(사건마다 하나) 본문만 본다. 기억·다른 기사·사건 요약(incidents.yaml 의 summary)은 쓰지 않는다.
      한 파일에 여러 사례가 실린 보고서는 사건 제목이 가리키는 사례만 본다.
      원문이 너무 짧거나 사건을 다루지 않으면 통제를 모두 null 로 두고 basis: thin.
  - id: R2
    title: 누구의 통제인가
    text: >-
      공격자가 AI 를 썼고 피해 쪽에 AI 시스템이 없는 사건은 analog 층만 가능하다 — 피해 조직의 일반 통제가 실패했나.
      피해 쪽의 AI 시스템·에이전트가 침해되거나 악용·일탈한 사건은 그 AI 의 통제가 agent 층이다.
      AI 공급자의 운영 통제(모델 접근 관리 · 남용 탐지 후 계정 차단 등)가 실패한 경우도 agent 층이다.
      공급자가 남용을 찾아 계정을 막은 것은 실패가 아니라 통제가 작동한 것이다 — 그 통제는 false.
  - id: R3
    title: 취약점 공개
    text: >-
      실제 피해가 없는 취약점 공개·연구 시연도 코딩한다 — 그 취약점이 가능했던 이유가 어느 통제의 부재인가.
      공개 문서가 적은 공격 조건(예: 에이전트가 사용자 권한으로 승인 없이 실행)이 근거다.
  - id: R4
    title: 결과만으로는 false
    text: >-
      '유출됐다 · 침해됐다 · 오래 지속됐다 · 늦게 탐지됐다' 는 결과다. 결과만으로 어떤 통제의 실패를 추론하지 않는다(inferred 도 아님).
      통제별 false_if 를 먼저 본다.
  - id: R5
    title: 증거
    text: true 마다 level · layer · quote(원문 그대로 20~250자) · reason(한 줄). 한 칸에 두 층이 모두 해당하면 더 직접적인 쪽 하나만 적고 reason 에 다른 층을 언급한다.

controls:
  inventory:
    failed_if: ["조직이 그 시스템·에이전트·계정·자산의 존재를 몰랐다 (섀도 AI · 미등록 에이전트 · 잊힌 서버 · 관리 목록 밖 자산)"]
    false_if: ["자산이 인터넷에 노출됐다는 것만 (노출 = 접근 통제 문제)", "피해 범위를 아직 모른다는 것"]
  vendors:
    # 2026-11-12 v2.1 — 공급망 경로만. 처음 문언('제3자의 결함이 원인')은 패치 안 된 CVE 사건을 거의 다 공급자 실패로 만들어
    # 패치 문제와 섞였다(두 팀 불일치 5칸 중 3칸). 이 통제는 제3자 '관계' 관리(선정 · 계약 · 통지 · 모니터링)다.
    failed_if:
      - "사건이 제3자 관계를 경로로 들어왔다 — 악성·변조된 패키지 · 확장 · 플러그인 · 스킬 · 모델, 침해된 공급자·위탁사·MSP, 제3자 연동(OAuth 토큰 · API 키 · 통합)을 거친 접근"
      - "공급자가 침해돼 변조된 배포물·업데이트가 사용자에게 갔거나 연동 토큰이 하류 조직에 쓰였다고 원문이 적었다 — 글이 공급자 중심이어도 true (v2.2)"
      - "제3자가 취약점·사고를 알리지 않았거나 늦게 알렸다고 원문이 적었다 (통지 실패)"
      - "제3자에게 맡긴 기능(호스팅 · 관리형 서비스 · 에이전트 플랫폼)의 운영 결함이 피해 조직의 데이터·권한 노출로 이어졌다고 원문이 적었다"
    false_if:
      - "피해 조직이 쓰던 제3자 소프트웨어에 취약점(CVE · 제로데이)이 있었다는 것만 — 패치 문제다. 공급자가 통지를 안 했거나 공급 경로가 변조됐다고 원문이 적으면 true"
      - "원문이 공급자 자신의 침해만 다루고, 그 침해가 공급 경로(배포물 · 업데이트 · 연동 토큰)를 거쳐 다른 조직에 닿았다는 서술이 없다 — 그 공급자의 다른 통제를 본다"
      - "공격자가 상용 AI 서비스를 도구로 썼다는 것만 (그 공급자의 남용 통제는 R2)"
  unique_id:
    failed_if: ["행위자를 구별·귀속할 수 없었다 — 에이전트가 사용자 세션·토큰을 그대로 썼다, 공유 계정, 위조·사칭 계정이 정상으로 통했다, 서비스 계정 키가 누구 것인지 모른다"]
    false_if: ["공격자가 정상 계정을 탈취해 썼다는 것만 (탈취 = 인증 문제 · 자격증명 보호. 원문이 귀속 불가를 적으면 true)", "MFA 가 없었다는 것만"]
  least_privilege:
    failed_if: ["행위자(계정 · 에이전트 · 토큰 · 도구)가 업무에 필요한 것보다 넓은 권한·도구·데이터 접근을 가져 피해가 가능하거나 커졌다", "신뢰할 수 없는 입력(웹 페이지 · 문서 · 이메일 · 이슈)을 읽은 에이전트가 고위험 행위를 할 수 있었다"]
    false_if: ["접근 통제가 없었다(인증 없는 API · 공개 노출)는 것만 — 권한의 범위가 아니라 문 자체가 없음. 원문이 범위를 적으면 true", "패치 안 된 취약점만"]
  human_approval:
    failed_if: ["고위험 행위(송금 · 삭제 · 배포 · 설정 변경 · 외부 전송 · 코드 실행)가 사람의 승인·확인 없이 실행됐다 / 승인 단계가 우회됐다"]
    false_if: ["자동화된 공격이 빨랐다는 것만", "사람이 피싱에 속았다 (승인이 있었고 사람이 잘못 승인 — 원문이 승인 절차를 적으면 reason 에 남기고 false)"]
  audit_trail:
    failed_if: ["로그·기록이 없었다 · 부족했다 · 지워졌다 · 보존되지 않았다 · 에이전트의 입력·도구 호출을 추적할 수 없었다 — 원문이 기록을 이름 붙여야 stated, 원인 규명이 기록 부족 때문이라고 적으면 stated"]
    false_if: ["늦게 탐지됐다 · 원인을 아직 모른다 · 조사 중이라는 것만 (R4)", "로그로 사건을 찾았다 (기록이 작동함)"]
  kill_switch:
    failed_if: ["행위를 멈추거나 권한을 회수할 수 없었다 · 늦었다 — 원문이 정지·차단·회수의 실패나 지연을 적어야 한다", "탈취된 자격증명·토큰이 발견 뒤에도 유효했다"]
    false_if: ["공격이 오래 지속됐다는 것만 (R4)", "발견 후 차단·회수했다 (통제가 작동함)"]
