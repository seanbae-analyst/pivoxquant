# ⚠️ 가상 예시 — 실제 기관이 아니다. 신호에서 레벨이 어떻게 도출되는지 보여 주는 합성 사례.
# 실제 기관 평가를 공개할 때의 명예훼손·공정성 위험 때문에(rubric.yaml pitfalls) 실존 회사를 넣지 않는다.
# 각 신호의 evidence 는 "이런 자료가 있으면 이 신호가 발화" 를 보여 주는 예시 문장이며 실제 평가가 아니다.
#
# 도출 예: inventory 는 L1 신호만 primary 로 발화 → 레벨 1.
#          human_approval 은 L2 신호가 primary 로 발화(L1 도 발화) → 최고값 레벨 2.
#          test_scope 는 L2 신호를 봤지만 press 라 발화 못 함(↓), L1 만 발화 → 레벨 1.
#          detection_time 은 L3 신호가 primary 로 발화 → 레벨 3.
#          escalation 은 전부 null → 미평가.
