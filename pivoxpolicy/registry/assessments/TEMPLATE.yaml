# 한 기관·한 기간·한 평가자의 내부통제 평가. 복사해서 assessments/<기관-기간-평가자>.yaml 로 저장.
#
# ⚠️ 레벨을 직접 적지 않는다. 각 차원의 **신호**마다 observed 와 증거 수준만 적으면
#    레벨은 도출된다(pivoxpolicy rubric --codebook 으로 신호 목록·절차 확인).
#
# observed:  true  — 그 신호가 공개 자료에서 보임
#            false — 찾아봤으나 안 보임 (레벨 0 의 근거가 됨)
#            null  — 아직 안 봤음 (해당 차원이 전부 null 이면 미평가, 분모에서 뺌)
# evidence:        observed:true 면 필수. 어느 자료의 무엇을 봤는지(쪽·조문·공시 번호).
# evidence_level:  primary(공시·제재문·감독기관/회사 원문) / press(보도) / vendor(보안업체) / unverified.
#                  L3 신호는 primary 라야 발화한다 — 보도만으로 레벨 3 불가.
subject: 기관명 또는 익명 코드
period: "2026"
assessor: CODER_NAME
provisional: true
basis: 어떤 공개 자료를 봤는지 요약
sources_checked:            # 레벨 0 을 주려면 필수 — 찾아봤으나 없었던 출처
  - "예: 2025 사업보고서 정보보호 항목"
  - "예: 금감원 제재내용 공개안 검색(2024-01~2026-10)"
scores:
  # 신호 id 는 rubric.yaml 의 각 차원 signals 참조. 아래는 inventory 예시 — 16차원 모두 채운다.
  inventory:
    mentions_ai_governance: {observed: null, evidence: "", source_url: "", evidence_level: unverified}
    discloses_ai_usecases:  {observed: null, evidence: "", source_url: "", evidence_level: unverified}
    verified_inventory:     {observed: null, evidence: "", source_url: "", evidence_level: unverified}
  # vendors / unique_id / least_privilege / human_approval / audit_trail / kill_switch
  # warning_receipt / escalation
  # test_frequency / test_scope / test_followup / test_coverage
  # detection_time / disclosure / remediation
  #   ↑ 각 차원의 신호 id 는 `pivoxpolicy rubric --codebook` 에 전부 나온다.
