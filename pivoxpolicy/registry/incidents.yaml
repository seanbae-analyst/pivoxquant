# AI 에이전트 관련 보안 사건 — 2025-01 이후, 금융 우선 + 비금융 주요 사례.
# 출처: pivoxpolicy-research 워크플로(threat-intel finder, 2026-11-11). finder 의 2차 verify 는 usage 한도로 중단돼,
# 이 세션이 45건 source_url 을 다시 받아 전부 HTTP 200 확인(source_checked). 내용 대조는 아님 — 요약은 finder 가 쓴 것.
#
# ai_role: attacker_used_ai_agent(공격자가 에이전트로 공격) · attacker_used_ai_tooling(AI 도구 보조) ·
#          victim_ai_system_exploited(피해 측 AI 시스템 침해) · ai_vulnerability_disclosed(취약점 공개) ·
#          suspected(AI 관여 추정, 확정 아님) · ai_system_misbehaved(AI 시스템이 스스로 일탈 — 평가·연구 중) ·
#          none(AI 관여 없음 — 비교 사례). 2026-11-11: finder 가 none 하나로 묶은 둘을 나눴다
# evidence_level: primary(정부·회사 원문) · vendor(보안업체 분석) · press(보도) — 요약 수치는 이 수준을 넘어 쓰지 않는다
# related_controls: 이 사건에서 실패했거나 관련된 7개 통제(controls.yaml id). finder 판단 — 2차 코딩 대상.
incidents:
  - id: kr-fin-chain-intrusions-2026-09
    date: "2026-10-14"
    title: "한국 금융권 연쇄 침해(신한은행 등 16개사→20개사) — AI 에이전트 도구 ARTEX 흔적, 당국은 '추정'"
    jurisdiction: KR
    target_sector: "financial"
    ai_role: suspected
    evidence_level: primary
    detected_by: "victim"
    related_controls: [inventory, least_privilege, audit_trail]
    source_url: "https://www.fsc.go.kr/no010101/87927"
    source_checked: "2026-11-11 HTTP 200"
    summary: "2026-09-27~10월 은행·저축은행·캐피탈·온투·가상자산 등 전 업권 침해. 금융위 10-14 집계 16개사 약 10만 건 유출, 11-05 기준 37개사 40건 약 47.3만 건. 외부 접점 인증 우회·비로그인 API 가 공통 경로. CrowdStrike(10-07)가 공격자 서버에서 ARTEX 설정·DeepSeek 백엔드·Claude Code 로그를 발견했다고 보고."
    notes: "date=금융위 2차 긴급회의 보도자료(집계 공표). 발생은 9/27~. AI 관여는 금융위원장 10-04 '배제 못해'(mtn·inews24 10-04, 200), 금보원 '추정'(덱 노트) — 확정 아님 → suspected. 벤더: CrowdStrike 블로그(2026-10-07, 200), Zscaler(10-14, 200), Check Point(11-05, 200). 11-05 수치 FSC 88086(200). 현대캐피탈 K20 'AI 활용 정보조회 공격' 은 SBS Biz 10-03 보도(200)."

