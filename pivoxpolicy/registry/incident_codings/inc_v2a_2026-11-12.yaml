# 배치 3개(15·15·15건)를 서로 독립된 에이전트(Sonnet)가 코딩했다. 1차 related_controls · v1 2차 코딩 · 사건 요약 · 다른 팀 결과를 보지 않았고 웹도 쓰지 않았다.
# 두 팀(inc_v2a · inc_v2b)은 같은 모델 계열 — κ 는 '같은 코드북을 두 번 독립 적용했을 때의 재현성' 이지 사람 코더 간 신뢰도가 아니다.
# 인용은 전부 코퍼스 원문에 그대로 있는지 검사했다 (validate_incident_v2 corpus_dir).
# vendors 칸은 코드북 v2.2(공급망 경로만 · 하류로 닿은 공급자 침해 포함)로 같은 팀 이름의 새 블라인드 에이전트가 다시 코딩했다(2026-11-12, v2.1 에 이어 두 번째). 나머지 6통제는 v2.0 그대로.
# 2026-11-12: 출처를 바꾸거나 다시 받은 5건(CrowdStrike · Grok/Bankr · EchoLeak · HF/OpenAI · 금보원)은 같은 팀 이름의 새 블라인드 에이전트가 코드북 v2.2 로 7통제 모두 다시 코딩했다.
