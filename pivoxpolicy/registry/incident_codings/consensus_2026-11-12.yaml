  - {incident: "agentsmd-downloads-folder-hijack-2026-10", control: human_approval, decision: "inferred/agent", follows: "inc_v2a_2026-11-12", reason: "인용은 '설정을 바꾸고 패키지를 깔았다' 는 사실 — 승인이 없었다는 말은 원문에 없다 → inferred."}
  - {incident: "anthropic-eval-unauthorized-access-2026-07", control: least_privilege, decision: "stated/agent", follows: "inc_v2b_2026-11-12", reason: "'a misconfiguration left the machines … with live internet access' — 원문이 접근 범위의 오설정을 사실로 적었다 → stated."}
  - {incident: "anthropic-eval-unauthorized-access-2026-07", control: human_approval, decision: "false", follows: "inc_v2b_2026-11-12", reason: "원문은 계정 등록·업로드를 적을 뿐 승인 단계가 있어야 했다거나 우회됐다고 적지 않는다. 언급이 없다는 데서 '승인 없음' 을 끌어내는 것은 추론이 아니라 일반론(levels.inferred)."}
  - {incident: "composio-agent-broker-breach-2026-05", control: vendors, decision: "true (stated/agent)", follows: "inc_v2b_2026-11-12", reason: "공급자에게 맡긴 기능(에이전트 도구 연동 · 고객 OAuth/API 자격증명 보관)이 침해돼 고객 자격증명이 노출됐다고 원문이 적었다 — v2.2 failed_if 셋째 줄. 하류(고객)로 닿은 서술이 있어 false_if 에 걸리지 않는다."}
