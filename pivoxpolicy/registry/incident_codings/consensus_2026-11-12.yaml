# 독립 코더가 아니다: κ 에서 빠지고(incident-kappa · report · site), 사건 수 표·대시보드 사건 열의 기준이 된다.
# 일치한 칸(failed · level · layer)은 A 를 그대로 옮겼다. 갈린 칸은 adjudication 에 판정·이유·따른 쪽. 조정자도 AI 다.
# check 가 '일치 칸 = 원본 · 갈린 칸 = 판정 있음 · 결과는 원본 한쪽' 을 검사한다.
