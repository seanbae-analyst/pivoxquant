    verified: true
    contributes: "목록·상세 200, PDF 200 285KB(pdftotext). 제재대상사실 5항 실측: (1) 패치 미실시 (2) 침입차단·탐지시스템 미설치(웹방화벽 등록 누락) (3) 주민번호·비밀번호 암호화 미이행(로그 평문) (4) 백신 미설치 — ※ 2025-06-20 CISO가 경영진에 'SKT와 동일한 상황' 보고했으나 보완 조치 없음 (5) 법규 준수 점검 소홀 — 상시평가에서 온라인결제시스템 미점검, 100점으로 대표이사·이사회 보고. 각주: 금보원 패치 권고 3회(2018~2024), 2022 금감원 정기검사 지적. → ciso_to_board(4)·warning_to_action(각주)·test_regime(5)·remediation_followup(1) 차원이 '제재 공개안'에서 레벨 3 증거로 잡힌 실례."

