<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 600" width="480" height="600" role="img" aria-label="Year-End Letter page 1">
  <rect width="480" height="600" fill="#FAF8F3"/>

  <!-- Masthead -->
