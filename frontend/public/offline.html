<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050505" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>오프라인 · PivoxQuant</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: #050505;
      color: #F5F0E8;
      font-family: "Source Serif 4", Georgia, "Times New Roman",
        "Apple SD Gothic Neo", "Nanum Myeongjo", serif;
      min-height: 100vh;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding:
        max(32px, env(safe-area-inset-top))
        24px
        max(32px, env(safe-area-inset-bottom));
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .pq-offline {
      max-width: 420px;
      width: 100%;
    }
    .pq-kicker {
      font-family: "Geist", -apple-system, system-ui, "Apple SD Gothic Neo", "Pretendard", sans-serif;
      color: #B8956A;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      margin-bottom: 28px;
    }
    .pq-kicker::before {
      content: "·";
      margin: 0 8px 0 0;
      color: rgba(184, 149, 106, 0.4);
    }
    h1 {
      font-weight: 400;
      font-size: clamp(28px, 6vw, 36px);
      line-height: 1.15;
      letter-spacing: -0.01em;
      margin-bottom: 20px;
      color: #F5F0E8;
    }
    .pq-body {
      font-family: "Geist", -apple-system, system-ui, "Apple SD Gothic Neo", "Pretendard", sans-serif;
      color: rgba(245, 240, 232, 0.62);
      font-size: 14px;
      line-height: 1.65;
      margin-bottom: 32px;
    }
    .pq-body + .pq-body {
      margin-top: -16px;
    }
    .pq-rule {
      width: 32px;
      height: 1px;
      background: rgba(184, 149, 106, 0.4);
      margin: 0 0 28px;
    }
    .pq-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 12px 22px;
      background: transparent;
      border: 1px solid rgba(184, 149, 106, 0.5);
      color: #B8956A;
      font-family: "Geist", -apple-system, system-ui, "Apple SD Gothic Neo", "Pretendard", sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      border-radius: 2px;
      cursor: pointer;
      transition: border-color 180ms cubic-bezier(0.16, 1, 0.3, 1),
        color 180ms cubic-bezier(0.16, 1, 0.3, 1);
    }
    .pq-btn:hover,
    .pq-btn:focus-visible {
      border-color: #B8956A;
      color: #F5F0E8;
      outline: none;
    }
    .pq-btn:active { transform: translateY(1px); }
    .pq-footnote {
      font-family: "Geist", -apple-system, system-ui, "Apple SD Gothic Neo", "Pretendard", sans-serif;
      font-size: 11px;
      color: rgba(245, 240, 232, 0.32);
      margin-top: 40px;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
  <main class="pq-offline" role="main">
    <div class="pq-kicker">PivoxQuant · 오프라인</div>
    <div class="pq-rule" aria-hidden="true"></div>
    <h1>지금은 신호가 없습니다.</h1>
    <p class="pq-body">
      연결이 끊겼습니다. 저장해 둔 관찰 기록은 그대로 열람할 수 있고,
      네트워크가 돌아오면 포트폴리오는 자동으로 다시 맞춰집니다.
    </p>
    <p class="pq-body">
      시장은 우리가 지켜보든 아니든 움직입니다. 가만히 있는 것도 하나의 포지션입니다.
    </p>
    <button class="pq-btn" type="button" onclick="window.location.reload()">다시 연결</button>
    <div class="pq-footnote">관찰 기반 리서치 도구입니다. 투자자문이 아닙니다.</div>
  </main>
</body>
</html>
