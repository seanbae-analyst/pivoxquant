<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockPilot — Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #050508;
      color: #fafafa;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      text-align: center;
    }
    .logo {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      margin-bottom: 2rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
      color: #fafafa;
    }
    p {
      color: #a1a1aa;
      font-size: 0.95rem;
      line-height: 1.6;
      max-width: 320px;
      margin-bottom: 2rem;
    }
    .retry-btn {
      background: #10b981;
      color: #050508;
      border: none;
      padding: 0.75rem 2rem;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .retry-btn:hover { opacity: 0.85; }
    .retry-btn:active { transform: scale(0.98); }
    .status {
      margin-top: 2rem;
      font-size: 0.8rem;
      color: #52525b;
    }
    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      margin-right: 6px;
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <img src="/icons/icon-192x192.png" alt="StockPilot" class="logo">
  <h1>현재 오프라인입니다</h1>
  <p>인터넷 연결을 확인해주세요.<br>연결이 복구되면 자동으로 데이터가 업데이트됩니다.</p>
  <button class="retry-btn" onclick="location.reload()">다시 시도</button>
  <div class="status"><span class="dot"></span>네트워크 연결 없음</div>
</body>
</html>
