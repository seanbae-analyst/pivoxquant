name: CEO Briefing

on:
  schedule:
    - cron: '30 21 * * *'
    - cron: '0 3 * * *'
    - cron: '30 10 * * *'
  workflow_dispatch:
    inputs:
      briefing_type:
        description: 'Briefing type'
        required: true
        default: 'morning'
        type: choice
        options:
          - morning
          - noon
          - evening

jobs:
  send-briefing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install sendgrid
      - name: Determine briefing type
        id: type
        run: |
          if [ -n "${{ github.event.inputs.briefing_type }}" ]; then
            echo "type=${{ github.event.inputs.briefing_type }}" >> $GITHUB_OUTPUT
          else
            HOUR=$(date -u +%H)
            if [ "$HOUR" -ge 21 ] || [ "$HOUR" -lt 3 ]; then
              echo "type=morning" >> $GITHUB_OUTPUT
            elif [ "$HOUR" -ge 3 ] && [ "$HOUR" -lt 10 ]; then
              echo "type=noon" >> $GITHUB_OUTPUT
            else
              echo "type=evening" >> $GITHUB_OUTPUT
            fi
          fi
      - name: Send briefing
        run: python scripts/briefing.py ${{ steps.type.outputs.type }}
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          CEO_EMAIL: sanghyun0115@naver.com
