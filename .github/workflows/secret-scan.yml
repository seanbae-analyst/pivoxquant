# Trufflehog secret scan — runs on every PR + push to main.
# Free tier (OSS, no SaaS). Source: 2026-05-10 security wave §5.2.
#
# 2026-09-06: base/head are deliberately NOT pinned. With `base: main` +
# `head: HEAD`, every push to main resolved both to the same commit and the
# action exited 1 with "BASE and HEAD commits are the same … won't scan
# anything" — it had failed on every main push since at least 2026-09-01
# while scanning nothing. Left unset, the action derives the range itself:
# push → github.event.before..github.sha, pull_request → base..head.
# fetch-depth: 0 stays so that range is actually present in the checkout.
name: Secret Scan

on:
  pull_request:
  push:
    branches: [main]

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Trufflehog OSS scan
        uses: trufflesecurity/trufflehog@v3.91.1
        with:
          extra_args: --only-verified
