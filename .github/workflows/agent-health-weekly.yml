name: Agent Health Weekly

on:
  schedule:
    - cron: '0 2 * * 0'  # Sun 11:00 KST
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run agent health analyzer
        run: |
          python3 scripts/agent_ops/analyze_health.py \
            --days 7 \
            --out report.md
          cat report.md

      - name: Open / update GitHub Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --label agent-health \
            --json number \
            --jq '.[0].number // empty')
          title="[Agent Health] Weekly $(date -u +'%Y-%m-%d')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" \
              --repo "$GITHUB_REPOSITORY" \
              --body-file report.md
          else
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --body-file report.md \
              --label agent-health \
              --assignee seanbae-analyst || \
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --body-file report.md \
              --label agent-health
          fi
