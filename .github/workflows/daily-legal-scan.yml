name: Daily Legal Scan

on:
  schedule:
    # 2026-05-03 cost reduction: was daily (30 runs/mo), now Monday-only (4 runs/mo).
    # Legal token patterns change infrequently; weekly cadence is sufficient.
    # daily-api-smoke + legal-guard.yml (PR gate) cover interim regressions.
    - cron: '15 0 * * 1'  # Monday 00:15 UTC = 09:15 KST
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  legal-regression:
    name: Legal regression scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install test dependencies
        run: pip install pytest pytest-flask

      - name: Install project dependencies
        run: pip install -r requirements.txt

      # 2026-09-10: this step ran tests/test_no_hardcoded_samples.py, which was
      # deleted with the artifact templates on 2026-08-31. pytest exited 4 ("file
      # not found") every week, so the scan was red regardless of the code and a
      # real regression would have been indistinguishable from the noise.
      # It now runs the legal suite CLAUDE.md §4 names as the live defence line.
      - name: pytest — live legal defence suite
        id: pytest_samples
        run: |
          set +e
          pytest -q --tb=short \
            tests/test_disclaimer_sot.py \
            tests/test_forbidden_terms_sync.py \
            tests/test_legal_deep_scan_local.py \
            tests/test_legal_filter.py \
            tests/test_legal_filter_forbidden_parity.py \
            tests/test_legal_scrub_decorator.py \
            tests/test_pivoxaudit_secret_leak.py \
            2>&1 | tee /tmp/pytest_samples.log
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Forbidden directive token sweep
        id: token_sweep
        run: |
          set +e

          # Paths to scan (production source only — tests and legal_filter.py excluded)
          SCAN_PATHS="routes services frontend/src"

          # --- EN forbidden tokens ---
          # Whitelist:
          #   forbidden_terms.py — term definition file itself
          #   negation context: never/not/no/does not recommend, no advice/recommendation
          #   quoted-prohibition comments: "Never use the words", "forbids recommendation"
          #   informational disclaimers: "informational only", "observational only"
          en_hits=$(grep -rnE \
            '\b(recommendation|buy recommendation|sell recommendation)\b' \
            $SCAN_PATHS \
            --include='*.py' --include='*.ts' --include='*.tsx' 2>/dev/null \
            | grep -v 'services/legal/forbidden_terms\.py' \
            | grep -v 'services/artifacts/year_end_letter_service\.py' \
            | grep -viE 'test_|__tests__/|\.test\.tsx?:|__pycache__|legal_filter\.py|disclaimer|consent' \
            | grep -viE 'never|not a|no |does not|misread|cannot|wording|solicitation' \
            | grep -viE 'informational|observational|no predict|advice or' \
            | grep -viE 'language|advice.*recommendation|recommendation.*advice|or advice' \
            | grep -viE '\* recommendation|recommendation.*fields|fields.*recommendation|``recommendation``' \
            | grep -v '``recommendation``' \
            | grep -vE 'profile/page\.tsx:[0-9]+:.*recommendation to buy or sell any security' \
            || true)

          # --- EN AI Coach / 투자 코치 ---
          # Whitelist: forbidden_terms.py definition file and scrub-context mentions
          coach_hits=$(grep -rnE \
            '\b(AI Coach|investment coach|투자\s*코치)\b' \
            $SCAN_PATHS \
            --include='*.py' --include='*.ts' --include='*.tsx' 2>/dev/null \
            | grep -v 'services/legal/forbidden_terms\.py' \
            | grep -viE 'test_|__tests__/|\.test\.tsx?:|__pycache__|legal_filter\.py|disclaimer' \
            | grep -viE 'scrubbed|forbidden|BUY/SELL/HOLD|scrub' \
            || true)

          # --- KR forbidden advisory terms ---
          # Whitelist: forbidden_terms.py definition, content/terms docs with explicit prohibition context,
          #   negation forms: "아닙니다" (is not), "아닌" (not a), "않" (do not)
          kr_hits=$(grep -rnE \
            '(매수\s*추천|매도\s*추천|투자\s*추천|종목\s*추천)' \
            $SCAN_PATHS \
            --include='*.py' --include='*.ts' --include='*.tsx' --include='*.md' 2>/dev/null \
            | grep -v 'services/legal/forbidden_terms\.py' \
            | grep -viE 'test_|__pycache__|legal_filter\.py|disclaimer|금지|없음|않습니다|안 합니다|절대|하지 않|아닙니다|아닌|또는 조언|이나 조언' \
            | grep -viE 'content/terms|terms-ko' \
            || true)

          total=0
          report=""

          if [ -n "$en_hits" ]; then
            cnt=$(echo "$en_hits" | wc -l | tr -d ' ')
            total=$((total + cnt))
            report+="### EN recommendation tokens ($cnt)\n\`\`\`\n$en_hits\n\`\`\`\n\n"
            echo "::error::Forbidden EN recommendation tokens found ($cnt hits)"
          fi

          if [ -n "$coach_hits" ]; then
            cnt=$(echo "$coach_hits" | wc -l | tr -d ' ')
            total=$((total + cnt))
            report+="### AI Coach / 투자 코치 token ($cnt)\n\`\`\`\n$coach_hits\n\`\`\`\n\n"
            echo "::error::Forbidden AI Coach / 투자 코치 token found ($cnt hits)"
          fi

          if [ -n "$kr_hits" ]; then
            cnt=$(echo "$kr_hits" | wc -l | tr -d ' ')
            total=$((total + cnt))
            report+="### KR advisory tokens ($cnt)\n\`\`\`\n$kr_hits\n\`\`\`\n\n"
            echo "::error::Forbidden KR advisory tokens found ($cnt hits)"
          fi

          echo "total=$total" >> $GITHUB_OUTPUT
          {
            echo "report<<EOF"
            printf '%b' "$report"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Evaluate results
        id: evaluate
        run: |
          pytest_ok="${{ steps.pytest_samples.outputs.exit_code }}"
          token_total="${{ steps.token_sweep.outputs.total }}"

          failed=false
          summary=""

          if [ "$pytest_ok" != "0" ]; then
            failed=true
            summary+="- pytest legal suite: FAILED (exit $pytest_ok)\n"
          else
            summary+="- pytest legal suite: PASSED\n"
          fi

          if [ "$token_total" != "0" ] && [ -n "$token_total" ]; then
            failed=true
            summary+="- Forbidden token sweep: FAILED ($token_total hits)\n"
          else
            summary+="- Forbidden token sweep: PASSED\n"
          fi

          echo "failed=$failed" >> $GITHUB_OUTPUT
          {
            echo "summary<<EOF"
            printf '%b' "$summary"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Open incident issue on failure
        if: steps.evaluate.outputs.failed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          title="[Legal] Daily legal scan failed @ $(date -u +'%Y-%m-%d %H:%M') UTC"
          body=$(cat <<'EOF'
          ## Daily Legal Scan — FAILED

          At least one legal regression check failed. Merge to main is NOT safe until resolved.

          ### Check results
          ${{ steps.evaluate.outputs.summary }}

          ### Token sweep detail
          ${{ steps.token_sweep.outputs.report }}

          ### pytest log (tail)
          See full run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          ### Remediation
          1. Review hits above
          2. Replace forbidden tokens with compliant alternatives (POSITIVE/NEGATIVE/NEUTRAL signals, AI Assistant)
          3. Verify `legal_filter.py` scrub is applied if the term is needed in context
          4. Re-run the suite named in the pytest step above

          /cc @seanbae-analyst
          EOF
          )
          existing=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --label autopilot,legal \
            --json number \
            --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" \
              --repo "$GITHUB_REPOSITORY" \
              --body "$body"
          else
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --body "$body" \
              --label autopilot,legal
          fi

          # Optional Slack notification (only fires if secret is set)
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -sS -X POST "$SLACK_WEBHOOK_URL" \
              -H 'Content-type: application/json' \
              --data "{\"text\":\"[PivoxQuant] Daily legal scan FAILED — see ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
          fi

      - name: Close stale incident on recovery
        continue-on-error: true
        if: steps.evaluate.outputs.failed != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for num in $(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --label autopilot,legal \
            --json number \
            --jq '.[].number'); do
            gh issue comment "$num" \
              --repo "$GITHUB_REPOSITORY" \
              --body "Legal scan recovered at $(date -u +%FT%TZ). Auto-closing."
            gh issue close "$num" --repo "$GITHUB_REPOSITORY"
          done
          echo "Legal scan PASSED — $(date -u +%FT%TZ)"

      - name: Fail job if issues found
        if: steps.evaluate.outputs.failed == 'true'
        run: exit 1
