name: Post-Deploy Canary

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one canary run matters per deploy. Cancel the previous one if a
# new push to main arrives before the 180s sleep window completes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  issues: write
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Wait for Railway + Vercel deploy window (180s)
        run: sleep 180

      - name: Backend health + data sanity
        id: probe
        env:
          RAILWAY_BACKEND_URL: ${{ secrets.RAILWAY_BACKEND_URL }}
        run: |
          set +e
          ok=1
          reasons=""

          # /api/health — retry 5x at 20s intervals (100s total) so Railway's
          # post-deploy boot window doesn't false-fail the canary.
          hbody=""
          for i in 1 2 3 4 5; do
            hbody=$(curl -sS -m 20 "${RAILWAY_BACKEND_URL}/api/health")
            if echo "$hbody" | grep -q '"status":"ok"'; then
              break
            fi
            echo "health attempt $i: not ok yet (body: ${hbody:0:120})"
            sleep 20
          done
          if ! echo "$hbody" | grep -q '"status":"ok"'; then
            ok=0
            reasons+="- /api/health not ok after 5 retries: ${hbody:0:200}\n"
          fi

          # Market indices auth-required returns 401 with JSON error — that's healthy.
          # 500/404 indicates route crash or blueprint registration failure.
          icode=$(curl -sS -m 20 -o /dev/null -w "%{http_code}" "${RAILWAY_BACKEND_URL}/api/market/indices?region=us")
          if [ "$icode" != "401" ] && [ "$icode" != "200" ]; then
            ok=0
            reasons+="- /api/market/indices returned unexpected HTTP $icode (expected 200 or 401)\n"
          fi

          # Frontend shell render
          fcode=$(curl -sS -m 20 -o /dev/null -w "%{http_code}" https://pivoxquant.com/)
          if [ "$fcode" != "200" ] && [ "$fcode" != "307" ] && [ "$fcode" != "308" ]; then
            ok=0
            reasons+="- pivoxquant.com returned HTTP $fcode\n"
          fi

          # /market page shell
          mcode=$(curl -sS -m 20 -o /dev/null -w "%{http_code}" https://pivoxquant.com/market)
          if [ "$mcode" != "200" ] && [ "$mcode" != "307" ] && [ "$mcode" != "308" ]; then
            ok=0
            reasons+="- /market page returned HTTP $mcode\n"
          fi

          echo "ok=$ok" >> $GITHUB_OUTPUT
          {
            echo "reasons<<EOF"
            echo -e "$reasons"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Canary passed
        if: steps.probe.outputs.ok == '1'
        run: echo "✅ Canary OK — ${{ github.sha }} safe on production"

      - name: Canary failed — open incident
        if: steps.probe.outputs.ok != '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          commit="${{ github.sha }}"
          short=$(echo "$commit" | cut -c1-7)
          title="🚨 Canary failed for $short"
          body=$(cat <<EOF
          ## Post-deploy canary caught a regression

          Commit: [\`$short\`](${{ github.server_url }}/${{ github.repository }}/commit/$commit)
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          ### Failures
          ${{ steps.probe.outputs.reasons }}

          ### Recommended immediate action
          1. Check Railway logs: https://railway.com/
          2. Check Vercel deployment: https://vercel.com/
          3. If backend broken and unclear cause: \`git revert $short --no-edit && git push\`

          /cc @seanbae-analyst
          EOF
          )
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body" --label autopilot,canary,P0
          exit 1
