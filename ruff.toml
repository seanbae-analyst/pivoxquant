# Ruff config for PivoxQuant backend.
# Goal: catch real bugs (F-codes), accept legacy style (E-codes).
# Most existing files predate ruff and contain idiomatic-but-stylistically-loose
# patterns (multi-statement lines in autotrader, module-level imports gated by
# feature flags). Fixing those is out of scope for the launch bundle and adds
# regression risk; the CI gate should fail only when a real bug class lands.

extend-exclude = [
    "frontend",
    "node_modules",
    "migrations/versions/_legacy",
    ".bkit",
]

line-length = 120
target-version = "py311"

[lint]
select = [
    "F",   # pyflakes — actual bugs (unused / undefined / shadowing)
    "E9",  # syntax errors
    "B006", "B008",  # mutable default args, function call as default
]

ignore = [
    "E701",   # multi-statement on one line — accepted in legacy code
    "E702",   # semicolons — same
    "E741",   # ambiguous var names (l, I, O) — accepted in numerical code
    "E402",   # module-level import not at top — feature-flag gated imports
    "E722",   # bare except — kept for defensive cron handlers; review case-by-case
    "F841",   # unused local — frequently kept for clarity in error branches
    "F601",   # repeated-key dict literal — defensive duplication in a few configs
]

[lint.per-file-ignores]
"tests/**" = ["F", "E"]
"scripts/**" = ["E402", "F401"]
"migrations/versions/**" = ["E402", "F401"]
"app.py" = ["E402"]
