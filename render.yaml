# Render Blueprint — PivoxQuant backend
# https://render.com/docs/blueprint-spec
#
# 2026-09-01. Written when the Railway account was deleted and the backend had
# to be rebuilt somewhere else. Railway's own config (railway.json /
# railway.toml / Procfile) is left in the tree on purpose: it still documents
# the deploy posture, and keeping it costs nothing if we ever go back.
#
# How the CEO uses this file:
#   1. Sign up at render.com and connect the GitHub repo.
#   2. New → Blueprint → pick this repo. Render reads this file.
#   3. Render prompts for every var marked `sync: false` — paste the values
#      from docs/ops/backend-restore-2026-09-01.md, which lists each one and
#      where to get it.
#   4. Deploy. First build takes a few minutes (the Dockerfile installs
#      requirements.txt from scratch).
#
# The database is NOT defined here. It lives on Supabase
# (project `pivoxquant`, ap-northeast-2), already schema-loaded and stamped at
# alembic head. DATABASE_URL is pasted in as a secret.

services:
  - type: web
    name: pivoxquant-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: singapore # closest Render region to KR users; Supabase DB is in ap-northeast-2 (Seoul)

    # ── Plan ────────────────────────────────────────────────────────────────
    # `free` spins the service down after 15 minutes with no traffic, and a
    # cold start costs roughly a minute. That is survivable for a closed beta
    # with no users, but it BREAKS THE CRON JOBS: RUN_SCHEDULER runs
    # APScheduler in-process, so a sleeping service fires no 52-week alerts, no
    # concentration alerts, and drains no email queues. The moment those need
    # to be real, this single line becomes `plan: 0.5c-512mb` (always on).
    #
    # Note the plan name: Render's blueprint spec takes instance sizes
    # (`free`, `0.5c-512mb`, `1c-2g`, ...), NOT the old marketing names. `plan:
    # starter` is rejected — verified against render.com/docs/blueprint-spec on
    # 2026-09-01, not from memory.
    plan: free

    healthCheckPath: /api/health
    autoDeployTrigger: commit

    envVars:
      # ── Non-secret posture ────────────────────────────────────────────────
      - key: FLASK_ENV
        value: production # load-bearing: gates the fail-fast in config.py, the
        # dev-login refusal in routes/__init__.py, and the
        # encryption-key check in services/crypto_service.py
      - key: POPULATE_CACHE_ON_BOOT
        value: "1"
      - key: RUN_SCHEDULER
        value: "1" # exactly one process may set this; the Dockerfile pins
        # gunicorn to --workers 1, so this is that process
      - key: ALPACA_ENABLED
        value: "0" # legal: enabling this needs an Alpaca commercial data licence
      - key: FRONTEND_URL
        value: https://www.pivoxquant.com
      - key: CORS_ORIGINS
        value: https://pivoxquant.com,https://www.pivoxquant.com,https://pivoxquant.vercel.app

      # ── Generated by Render, never seen by a human ────────────────────────
      # Both are fine to generate fresh: the old prod DB is gone, so there are
      # no sessions or CSRF tokens left to invalidate.
      - key: SECRET_KEY
        generateValue: true
      - key: CSRF_SECRET
        generateValue: true

      # ── Secrets — Render prompts for each of these at Blueprint creation ──
      # Values and provenance: docs/ops/backend-restore-2026-09-01.md
      - key: DATABASE_URL
        sync: false
      - key: PIVOX_BROKER_ENCRYPTION_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: KAKAO_CLIENT_ID
        sync: false
      - key: KAKAO_CLIENT_SECRET
        sync: false
      - key: FMP_API_KEY
        sync: false
      - key: KIS_APP_KEY
        sync: false
      - key: KIS_APP_SECRET
        sync: false
      # ── 이메일 전송 ───────────────────────────────────────────────────
      # cascade 는 SendGrid → Brevo → SMTP 다 (services/email/sender.py).
      # 자격증명이 실제로 있는 건 SendGrid 와 SMTP 두 개이므로 그 둘을 넣는다.
      #
      # 2026-09-01 정정: 이 자리에는 원래 BREVO_API_KEY 만 있었고 SendGrid 와
      # SMTP 는 빠져 있었다. 그대로 배포했다면 **전송 경로가 하나도 설정되지
      # 않은 채** 부팅해서, 탈퇴 확인 메일(PIPA §21 ① 법적 의무)까지 조용히
      # 실패했을 것이다. Brevo 는 Railway 가 SMTP 아웃바운드를 막아서
      # (OSError 101) 넣었던 우회로이고, Render 에서도 막히는지는 미검증이다.
      # 배포 후 SendGrid·SMTP 가 둘 다 실패하면 그때 Brevo 를 발급받아
      # 대시보드에서 BREVO_API_KEY 를 추가하면 된다 — Blueprint 수정 불필요.
      - key: SENDGRID_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false

      # RAILWAY_BACKEND_URL is misnamed but not Railway-specific: routes/auth.py
      # reads it to build the logout Origin allowlist. Set it to the Render URL
      # (https://pivoxquant-api.onrender.com) once Render assigns one.
      - key: RAILWAY_BACKEND_URL
        sync: false

      # ── Deliberately NOT set ──────────────────────────────────────────────
      # DEV_LOGIN_SECRET — routes/__init__.py refuses to boot when this is set
      #   alongside FLASK_ENV=production. It is an E2E-only bypass.
      # BETA_PASSWORD — frontend-only. The beta interstitial lives in
      #   frontend/middleware.ts and frontend/src/app/api/beta-auth/route.ts,
      #   so the value belongs on Vercel, where it already is. The backend
      #   never reads it; services/launch_prep.py lists it in its env
      #   inventory, which is why it looks like a backend variable and is not.
      # ANTHROPIC_API_KEY — the support chatbot was the only live consumer and
      #   it was removed 2026-09-01. services/ai/ still exists but every one of
      #   its nine public methods has zero callers (the 8-31 prune deleted the
      #   analysis surfaces), and fetcher's news scorer is likewise unreachable.
      # SIM_ONBOARD_SECRET — only needed to restore the CAUS sim user flow.
      # STRIPE_* — payment stays gated off until BUSINESS_REGISTRATION and the
      #   lawyer's Q1-Q15 opinion land. Adding the keys does not enable it.
