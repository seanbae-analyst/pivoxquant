# Render Blueprint — PivoxQuant backend
# https://render.com/docs/blueprint-spec
#
# 2026-09-01. Written when the Railway account was deleted and the backend had
# to be rebuilt somewhere else. Railway's own config (railway.json /
# railway.toml / Procfile) is left in the tree on purpose: it still documents
# the deploy posture, and keeping it costs nothing if we ever go back.
#
# How the CEO uses this file:
#   1. Sign up at render.com and connect the GitHub repo.
#   2. New → Blueprint → pick this repo. Render reads this file.
#   3. Render prompts for every var marked `sync: false` — paste the values
#      from docs/ops/backend-restore-2026-09-01.md, which lists each one and
#      where to get it.
#   4. Deploy. First build takes a few minutes (the Dockerfile installs
#      requirements.txt from scratch).
#
# The database is NOT defined here. It lives on Supabase
# (project `pivoxquant`, ap-northeast-2), already schema-loaded and stamped at
# alembic head. DATABASE_URL is pasted in as a secret.

services:
  - type: web
    name: pivoxquant-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: singapore # closest Render region to KR users; Supabase DB is in ap-northeast-2 (Seoul)

    # ── Plan ────────────────────────────────────────────────────────────────
    # `free` spins the service down after 15 minutes with no traffic, and a
    # cold start costs roughly a minute. That is survivable for a closed beta
    # with no users, but it BREAKS THE CRON JOBS: RUN_SCHEDULER runs
    # APScheduler in-process, so a sleeping service fires no 52-week alerts, no
    # concentration alerts, and drains no email queues. The moment those need
    # to be real, this single line becomes `plan: 0.5c-512mb` (always on).
    #
    # Note the plan name: Render's blueprint spec takes instance sizes
    # (`free`, `0.5c-512mb`, `1c-2g`, ...), NOT the old marketing names. `plan:
    # starter` is rejected — verified against render.com/docs/blueprint-spec on
    # 2026-09-01, not from memory.
    plan: free

    healthCheckPath: /api/health
    autoDeployTrigger: commit

    envVars:
      # ── Non-secret posture ────────────────────────────────────────────────
      - key: FLASK_ENV
        value: production # load-bearing: gates the fail-fast in config.py, the
        # dev-login refusal in routes/__init__.py, and the
        # encryption-key check in services/crypto_service.py
      - key: POPULATE_CACHE_ON_BOOT
        value: "1"
      - key: RUN_SCHEDULER
        value: "1" # exactly one process may set this; the Dockerfile pins
        # gunicorn to --workers 1, so this is that process
      - key: ALPACA_ENABLED
        value: "0" # legal: enabling this needs an Alpaca commercial data licence
      - key: FRONTEND_URL
        value: https://www.pivoxquant.com
      - key: CORS_ORIGINS
        value: https://pivoxquant.com,https://www.pivoxquant.com,https://pivoxquant.vercel.app

      # ── Email dispatch (CEO decision 2026-09-07: all four ON) ─────────────
      # Declared here rather than typed into the dashboard so the setting is
      # version-controlled and survives a Blueprint re-sync. All four default
      # to "false" in code, so their absence was the OFF state.
      #
      # CS1 is a *consent-enforcement* switch, not a send switch: turning it on
      # makes sending STRICTER. With it off, services/email/sender.py skips the
      # per-category consent check entirely (only the baseline
      # marketing_consent_at deny applies). With it on, INFORMATION and
      # MARKETING sends are blocked unless that user's own per-category consent
      # column is set and unrevoked — 정통망법 §50 ① 분리 동의, enforced.
      #
      # ⚠️ The code comments and tests/test_consent_categories_cs1.py:15 record
      # CS1 as waiting on the lawyer's Q-S1 answer. It is being turned on ahead
      # of that answer by CEO decision. The direction is the conservative one
      # (it can only suppress sends, never permit one the old path refused), so
      # this does not widen legal exposure — but the Q-S1 question stays open.
      - key: PIVOX_CS1_CONSENT_ENABLED
        value: "true"
      - key: PIVOX_ONBOARDING_SEQUENCE_ENABLED
        value: "true" # welcome · d3_guide · d7_pro_nudge
      - key: PIVOX_RETENTION_ENABLED
        value: "true" # d7_summary · d30_summary — both now refuse to send
        # when build_record_summary() returns None (the silence rule)
      - key: PIVOX_INACTIVE_NUDGE_ENABLED
        value: "true" # 광고성, night-banned 21:00–08:00 KST
      #
      # ⚠️ NOT enabled, deliberately: PIVOX_PAID_PLANS_ENABLED and
      # PIVOX_CHECKOUT_FOLLOWUP_ENABLED. The beta is free (CEO 2026-09-04);
      # both belong to the paid path and stay dormant.
      #
      # ⚠️ These four are necessary but NOT sufficient. Every one of these mails
      # is dispatched by the in-process APScheduler (cron_jobs.py:470-483
      # `ops_email_scheduler` / `ops_inactive_nudge`), and `plan: free` above
      # spins the service down after 15 idle minutes — a sleeping service drains
      # no queue. See the plan comment at the top of this service block.

      # ── Generated by Render, never seen by a human ────────────────────────
      # Both are fine to generate fresh: the old prod DB is gone, so there are
      # no sessions or CSRF tokens left to invalidate.
      - key: SECRET_KEY
        generateValue: true
      - key: CSRF_SECRET
        generateValue: true

      # ── Secrets — Render prompts for each of these at Blueprint creation ──
      # Values and provenance: docs/ops/backend-restore-2026-09-01.md
      - key: DATABASE_URL
        sync: false
      - key: PIVOX_BROKER_ENCRYPTION_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: KAKAO_CLIENT_ID
        sync: false
      - key: KAKAO_CLIENT_SECRET
        sync: false
      - key: FMP_API_KEY
        sync: false
      - key: KIS_APP_KEY
        sync: false
      - key: KIS_APP_SECRET
        sync: false
      # ── 이메일 전송 ───────────────────────────────────────────────────
      # cascade 는 SendGrid → Brevo → SMTP 다 (services/email/sender.py).
      # 자격증명이 실제로 있는 건 SendGrid 와 SMTP 두 개이므로 그 둘을 넣는다.
      #
      # 2026-09-01 정정: 이 자리에는 원래 BREVO_API_KEY 만 있었고 SendGrid 와
      # SMTP 는 빠져 있었다. 그대로 배포했다면 **전송 경로가 하나도 설정되지
      # 않은 채** 부팅해서, 탈퇴 확인 메일(PIPA §21 ① 법적 의무)까지 조용히
      # 실패했을 것이다. Brevo 는 Railway 가 SMTP 아웃바운드를 막아서
      # (OSError 101) 넣었던 우회로이고, Render 에서도 막히는지는 미검증이다.
      # 배포 후 SendGrid·SMTP 가 둘 다 실패하면 그때 Brevo 를 발급받아
      # 대시보드에서 BREVO_API_KEY 를 추가하면 된다 — Blueprint 수정 불필요.
      - key: SENDGRID_API_KEY
        sync: false
      # SENDGRID_WEBHOOK_PUBLIC_KEY is NOT listed here on purpose — it is the
      # ECDSA key that verifies SendGrid's event webhook, and it is the only
      # `recommended` inventory entry render.yaml does not supply (measured
      # 2026-09-01: required-missing 0, recommended-missing 1). Consequence:
      # POST /api/webhooks/sendgrid returns 503 and open/bounce tracking
      # (Artifact.opened_at, auto opt-out on spamreport) stays dark until it
      # is added in the Render dashboard. It fails CLOSED — an unset key
      # refuses events rather than accepting forged ones — so this does not
      # block launch and does not affect sending. Add it when you want
      # delivery telemetry; no Blueprint change needed.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false

      # RAILWAY_BACKEND_URL is misnamed but not Railway-specific: routes/auth.py
      # reads it to build the logout Origin allowlist. Set it to the Render URL
      # (https://pivoxquant-api.onrender.com) once Render assigns one.
      - key: RAILWAY_BACKEND_URL
        sync: false

      # ── Deliberately NOT set ──────────────────────────────────────────────
      # DEV_LOGIN_SECRET — routes/__init__.py refuses to boot when this is set
      #   alongside FLASK_ENV=production. It is an E2E-only bypass.
      # BETA_PASSWORD — retired 2026-09-04 (free launch, no gate). The
      #   frontend interstitial and its env vars were deleted; nothing
      #   reads this anywhere any more.
      # ANTHROPIC_API_KEY — the support chatbot was the only live consumer and
      #   it was removed 2026-09-01; services/ai/ itself was deleted the same
      #   day (zero callers). Only the disabled self-healing / morning-triage
      #   scripts still import anthropic, and they do not run on Render.
      # SIM_ONBOARD_SECRET — gone. CAUS was retired 2026-09-01 and the
      #   sim-onboard blueprint deleted with it; setting this now does nothing.
      # STRIPE_* — payment stays gated off until BUSINESS_REGISTRATION and the
      #   lawyer's Q1-Q15 opinion land. Adding the keys does not enable it.
