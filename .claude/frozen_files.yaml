# Verification commands
verification:
  pr_diff_check: |
    git diff --name-only origin/main..HEAD | \
      python3 -c "
      import sys, yaml
      with open('.claude/frozen_files.yaml') as f:
          frozen = yaml.safe_load(f)
      hard = {p['path'] for p in frozen['hard_frozen']}
      changed = set(line.strip() for line in sys.stdin if line.strip())
      blocked = changed & hard
      if blocked:
          print(f'BLOCKED: {blocked}')
          sys.exit(1)
      "

  pre_commit_hook: |
    # .git/hooks/pre-commit (권고)
    git diff --cached --name-only | python3 scripts/check_frozen.py

# 0원 (feedback_no_extra_cost 준수)
cost: "0원 — git diff + python stdlib + yaml (이미 설치) 만"
