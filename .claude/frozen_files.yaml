  - "CEO override: <reason> — 커밋 메시지에 명시 시 모든 hard_frozen 일시 허용 (본 yaml 갱신 PR 동봉)"

# Verification commands
verification:
  pr_diff_check: |
    git diff --name-only origin/main..HEAD | \
      python3 -c "
      import sys, yaml, fnmatch
      with open('.claude/frozen_files.yaml') as f:
          frozen = yaml.safe_load(f)
      hard = [p['path'] for p in frozen['hard_frozen']]
      changed = {line.strip() for line in sys.stdin if line.strip()}
      blocked = {c for c in changed if any(fnmatch.fnmatch(c, h) for h in hard)}
      if blocked:
          print(f'BLOCKED: {sorted(blocked)}')
          sys.exit(1)
      "

  escape_tokens: |
    # 커밋 메시지에 택1
    #   legal-kr-fintech approved · fx-consistency-guard approved
    #   migration-guard approved  · CEO override: <reason>
    # (.githooks/pre-commit 은 아직 옛 3토큰만 grep 한다 — 훅 갱신 PR 에서 migration-guard 추가)
    git log origin/main..HEAD --format="%B" | grep -Ei "approved|CEO override:"

# 0원 (feedback_no_extra_cost 준수)
cost: "0원 — git diff + python stdlib + yaml (이미 설치) 만"
